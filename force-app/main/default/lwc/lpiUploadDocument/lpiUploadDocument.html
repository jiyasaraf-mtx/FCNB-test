															<lightning-button-icon size="small"
																icon-name="utility:download"
																data-parentrecid={file.parentRecId} tabindex="0"
																onclick={handleDownload}
																aria-label={file.downloadAriaLabel}>
															</lightning-button-icon>
														</div>
													</div>
												</template>
											</div>
											<div if:true={data.documentRecord.ContentDocumentLinks}>
												<template if:true={data.documentRecord.ContentDocumentLinks}
													for:each={data.documentRecord.ContentDocumentLinks.records}
													for:item="cv">
													<div class="slds-grid slds-p-top_x-small" key={cv.Id}>

														<lightning-button-icon size="small" icon-name="utility:download"
															onclick={handleDownload}
															data-ext={cv.ContentDocument.FileExtension}
															data-filename={cv.Title}
															data-contentid={cv.ContentDocument.Id} tabindex="0"
															title={cv.ContentDocument.Title} onkeydown={handleKeyDown}
															aria-label={cv.downloadAriaLabel}
															data-parentrecid={data.documentRecord.Id}>
														</lightning-button-icon>

													</div>
												</template>
											</div>
										</td>
									</template>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
			</template>
		</template>
		<!--Added By GJ -- Ends Here-->


	</div>
	<template if:true={isShowModal}>
		<template if:true={addDocId}>
			<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
				aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open" onkeydown={handleEscAddModal}>
				<div class="slds-modal__container">
					<header class="slds-modal__header">
						<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
							title="Close" onclick={hideModalBox}>
							<lightning-icon icon-name="utility:close" variant="inverse"
								size="small"></lightning-icon>
							<span class="slds-assistive-text">Close Add Other Documents</span>
						</button>
						<h1 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Add Other Documents
						</h1>
					</header>
					<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
						<p class="asterisk-caption m-b-medium">Asterisk (<span class="c-red">*</span>) indicates required field</p>
						<div class="slds-grid slds-wrap">
							<div class="slds-col slds-size_1-of-1 m-b-medium">
								<lightning-input type="text" label="Document Name" required value={newDocumentName}
									max-length="255" pattern="^((?!(<\s*|\s*>)).)*$" class="new-doc"
									message-when-pattern-mismatch="Invalid input. This field only accepts letters and numbers. Special characters are not allowed."
									message-when-value-missing="Error: Document Name is required."
									onchange={handleNewDocumentNameChange}></lightning-input>
							</div>
							<div class="slds-col slds-size_1-of-1 m-b-medium">
								<lightning-textarea label="Description" value={newDocumentDescription}
									onchange={handleNewDocumentDescChange} maxlength="500"
									message-when-too-long="A maximum of 500 characters are allowed.">
								</lightning-textarea>
							</div>
							<div class="slds-col slds-size_1-of-1 m-b-medium">
								<span if:false={isfileUploaded}>
									<lightning-file-upload class="setUploadBtnFocus" if:true={addDocId} name="fileUploader"
										accept={acceptedFormats} record-id={addDocId}
										onuploadfinished={handleUploadFinishedTest}>
									</lightning-file-upload>
								</span>
								<span if:true={isfileUploaded}>
									{newfilename}
									<lightning-button-icon size="small" style='margin-left:10px'
										class="slds-float_right" icon-name="utility:download"
										data-parentrecid={addDocId} onclick={handleDownload} >
									</lightning-button-icon>
									<lightning-button-icon size="small" style='margin-left:10px'
										class="red-icon slds-float_right" icon-name="utility:delete" data-flow="child"
										data-parentrecid={addDocId} onclick={handleDelFile} aria-label="delete">
									</lightning-button-icon>
								</span>
							</div>
						</div>
					</div>
					<footer class="slds-modal__footer">
						<button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
						<button class="slds-button slds-button_brand" onclick={handleSaveNewDocument}
							disabled={isFromValid}>Save</button>
					</footer>
				</div>
			</section>
			<div class="slds-backdrop slds-backdrop_open"></div>
		</template>
	</template>
	<!-- modal end -->
	<!-- GJ modal start -->
	<template if:true={isShowUploadModal}>
		<template if:true={isAppDocId}>
			<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true"
				aria-describedby="modal-content-id-1" class="dfs-modal slds-modal slds-fade-in-open" onkeydown={handleEscCloseModal}>
				<div class="slds-modal__container">
					<!-- modal header start -->
					<div class="slds-modal__header">
						<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close" onclick={hideUploadModalBox}>
						<lightning-icon icon-name="utility:close" variant="inverse"
							size="small"></lightning-icon>
							<span class="slds-assistive-text">Close {documentName}</span>
						</button>
						<h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate slds-m-around--none docName">
							{documentName}</h1>
					</div>
					<!-- modal body start -->
					<div class="slds-modal__content" id="modal-content-id-2">
						<div if:true={otherDocument}>
							<span if:true={isChildDoc}>
								<lightning-file-upload if:true={newAppDocId} name="fileUploader"
									accept={acceptedFormats} record-id={newAppDocId}
									onuploadfinished={handleUploadFinishedTest}>
								</lightning-file-upload>
							</span>
							<span if:false={isChildDoc}>
								<lightning-file-upload if:false={isChildDoc} name="fileUploader"
									accept={acceptedFormats} record-id={documentIdForFileUpload}
									onuploadfinished={handleUploadFinishedTest}>
								</lightning-file-upload>
							</span>
						</div>
						<div if:true={isOneByOnePhoto}>
							<p>Upload a JPG/JPEG file</p>
							<span if:true={isChildDoc}>
								<lightning-file-upload if:true={newAppDocId} name="fileUploader"
									accept={acceptedOneByOneFormats} record-id={newAppDocId}
									onuploadfinished={handleUploadFinishedTest}>
								</lightning-file-upload>
							</span>
							<span if:false={isChildDoc}>
								<lightning-file-upload if:false={isChildDoc} name="fileUploader"
									accept={acceptedOneByOneFormats} record-id={documentIdForFileUpload}
									onuploadfinished={handleUploadFinishedTest}>
								</lightning-file-upload>
							</span>
						</div>
						<div if:true={isfirstDoc}>
							<div if:true={isTwoByTwoPhoto}>
								<p>Upload a JPG/JPEG/PNG file</p>
								<p class="m-b-small regular-text-14 text-secondary">Photo must not contain pictures where hats, caps or other head covers are worn. No dark
									glasses can be worn on the photo.</p>
								<lightning-input if:true={isTwoByTwoPhoto} name="file" onchange={uploadFileDoc}
									type="file" class="document-class custom-upload-button__small"
									aria-label="Upload Document New" data-recordid={documentIdForFileUpload}>
								</lightning-input>
							</div>
						</div>
						<div if:false={isfirstDoc}>
							<div if:true={isTwoByTwoPhoto}>
								<p>Upload a JPG/JPEG/PNG file</p>
							
								{twoByTwoWarning}
								<lightning-input if:true={isTwoByTwoPhoto} name="file" onchange={uploadFileDoc}
									type="file" class="document-class custom-upload-button__small"
									aria-label="Upload Document New" data-recordid={documentIdForFileUpload}>
								</lightning-input>
							</div>
						</div>
					</div>
					<!-- modal footer start-->
					<footer class="slds-modal__footer slds-grid_align-center">
						<button class="slds-button slds-button_neutral" onclick={hideUploadModalBox}>Cancel</button>
					</footer>
				</div>
			</section>
			<div class="slds-backdrop slds-backdrop_open"></div>
		</template>
	</template>
	<!-- modal end -->
	<template if:true={isShowDeleteModal}>
		<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-03" aria-modal="true"
			aria-describedby="modal-content-id-3" class="dfs-modal slds-modal slds-fade-in-open" onkeydown={handleESCcancel}>
			<div class="slds-modal slds-fade-in-open slds-backdrop">
				<div class="slds-modal__container">
					<header class="slds-modal__header ">
						<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close" onclick={hideUploadModalBox}>
						<lightning-icon icon-name="utility:close" variant="inverse"
							size="small"></lightning-icon>
							<span class="slds-assistive-text">Close Delete Document</span>
						</button>
						<h1 class="slds-grid_align-center slds-modal__title slds-hyphenatex"> Delete </h1>
					</header>
					<div class="slds-modal__content" id="modal-content-id-3">
						Are you sure you want to delete this file?
					</div>
					<footer class="slds-modal__footer slds-grid_align-center">
						<button class="slds-button slds-button_neutral" onclick={handlecancel}>Cancel</button>
						<button class="slds-button slds-button_brand" onclick={handleFileDelete}>Proceed</button>
					</footer>
				</div>
			</div>
		</section>
	</template>

	<template if:false={isRevirwPage}>
		<!-- <div class="additional-doc-border m-t-xl slds-grid slds-grid--vertical-stretch">
			<div class="slds-col slds-size--9-of-12">
				<h3 class="bold-24 m-b-xs">Additional Document</h3>
				<p class="semiBold-16 text-secondary" aria-label={additionalUploadDocTxt}>{additionalUploadDocTxt}</p>
			</div>
			<div class="justify-end slds-col slds-grid slds-size--3-of-12">
				<lightning-button label="+ Add Documents" variant="neutral" title="Add Documents" class="btnAddDocFocus"
					onclick={addNewDoc}>
				</lightning-button>
			</div>
		</div> -->
		<div class="additional-doc-border m-t-xl slds-grid slds-wrap">
			<div class="slds-col slds-size_9-of-12">
				<h3 class="bold-24 m-b-xs">Additional Document</h3>
				<p class="semiBold-16 text-secondary" aria-label={additionalUploadDocTxt}>{additionalUploadDocTxt}</p>
			</div>
			<div class="slds-col slds-size_3-of-12 slds-text-align_right">
				<lightning-button 
					label="+ Add Documents" 
					variant="neutral" 
					title="Add Documents" 
					class="btnAddDocFocus"
					onclick={addNewDoc}>
				</lightning-button>
			</div>
		</div>
	</template>
</template>
