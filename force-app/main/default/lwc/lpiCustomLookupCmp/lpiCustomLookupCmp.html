<template>
    <div class="slds-form-element" onmouseleave={toggleResult} data-source="lookupContainer">
        <div class="slds-combobox_container slds-has-selection">
            <label class="slds-form-element__label" for="combobox-id-1"><span
                    class="slds-required">&#42;</span>{label}</label>
            <div class="lookupInputContainer slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right" role="none">
                    <div class="searchBoxWrapper slds-show">
                        <!--Lookup Input Field-->
                        <lightning-input type="search" data-source="searchInputField" onclick={toggleResult}
                            onkeypress={toggleResult} onchange={handleKeyChange} is-loading={isSearchLoading}
                            value={searchKey} aria-live="assertive" aria-atomic="true" variant="label-hidden"
                            placeholder="Search License Here..." required class="combobox_input searchOwnershipLicense"
                            onkeydown={changeAriaLabel}  aria-label={searchAriaLabel}
                            message-when-value-missing="Error: License Number is required."></lightning-input>
                    </div>

                    <!--Lookup Selected record pill container start-->
                    <div class="pillDiv slds-hide">
                        <!-- <span class="slds-icon_container slds-combobox__input-entity-icon">
                                <lightning-icon icon-name={iconName} size="x-small" alternative-text="icon"></lightning-icon>  
                            </span> -->
                        <input type="text" id="combobox-id-1" value={selectedRecord.searchedKey}
                            class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
                        <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                            title="Remove selected option" onkeydown={handleKeyDown}>
                            <lightning-icon icon-name="utility:close" size="x-small" alternative-text="close icon"
                                aria-label="License number clear" onclick={handleRemove}></lightning-icon>
                        </button>
                    </div>
                </div>

                <!-- lookup search result part start-->
                <div style="margin-top:0px" id="listbox-id-5"
                    class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox"
                    onmousedown={preventFocusLosing}>
                    <ul class="slds-listbox slds-listbox_vertical" role="presentation" onkeydown={handleKeyDownFocus}>
                        <template for:each={lstResult} for:item="obj">
                            <li tabindex="-1" key={obj.Id} role="presentation" class="slds-listbox__item li-ariafocus"
                                data-recid={obj.Id} >
                                <div data-recid={obj.Id} onclick={handelSelectedRecord}
                                    onmousedown={handelSelectedRecord} id={obj.Id}
                                    class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                    role="option" >
                                    <span style="pointer-events: none;" class="slds-media__body">
                                        <span
                                            class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.searchedKey}</span>
                                    </span>
                                </div>
                            </li>
                        </template>
                        <!--ERROR msg, if there is no records..-->
                        <template if:false={hasRecords}>
                            <li class="slds-listbox__item" style="text-align: center; font-weight: bold;">No Records
                                Found....</li>
                        </template>
                    </ul>

                </div>
            </div>
        </div>
    </div>
</template>
