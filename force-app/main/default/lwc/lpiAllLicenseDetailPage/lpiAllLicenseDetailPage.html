<template>
    <div class="backdrop" if:true={showSpinner}>
        <div class="spinner">
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </div>
    </div>
    <h1 if:false={isAllLicense} class="bold-32 m-b-medium">{labels.myCertifications}</h1>
    <h1 if:true={isAllLicense} class="bold-32 m-b-medium">{labels.allCertifications}</h1>


    <div class="slds-grid slds-gutters dashboard-details my-licenses slds-p-top_x-small">
        <template for:each={statusFilter} for:item="item">
            <div class={item.class} key={item.label} data-id={item.value} onclick={getMyLicenseDetails}
                onkeydown={handleKeyDown}>
                <div class="slds-card" data-id={item.value} tabindex="0" aria-label={item.label}>
                    <div class="slds-clearfix" data-id={item.value}>
                        <div class="slds-float_top slds-m-bottom_small" data-id={item.value}>
                            <i class={item.iconUrl}></i>
                        </div>
                        <div class="slds-float_bottom" data-id={item.value}>
                            <div class="slds-page-header__title" data-id={item.value}>{item.label}</div>
                            <div class="licenses-counter" data-id={item.value}>{item.Count}</div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
    <div class="warning-message-box slds-p-top_none slds-list_horizontal">
        <lightning-icon class=" slds-icon-utility-info-alt slds-icon_container slds-m-right_small"
            icon-name="utility:info_alt" title={labels.warning}>
            <span style="--sds-c-icon-color-background: var(--slds-c-icon-color-background, transparent)"
                part="boundary">
                <lightning-primitive-icon size="medium" variant="">...</lightning-primitive-icon>
                <span class="slds-assistive-text">{labels.warning}</span>
            </span>
        </lightning-icon>
        <div class="slds-media__body">
            <div>{labels.importantNotice}</div>
            <p>{labels.noticeLicense}</p>
        </div>
    </div>

    <div class='slds-m-vertical_large dashboard-table-details all-license-table'>
        <div class="slds-card">
            <div class="slds-grid m-b-small slds-grid--vertical-align-center">
                <div class="semiBold-18 m-r-small">{childCardTitle}</div>
                <lightning-input name="enter-search" type="search" class="search-input width-40" variant="label-hidden"
                    placeholder={labels.searchLicenseTypePlaceholder}
                    onchange={handleSearch}></lightning-input>
            </div>
            <c-lpi-dashboard-table-details onchildmethod={callFromChild} paymentdata={paymentdata}
                applicationdata={applicationdata} licensedata={licensedata} columns={myLicenseColumns}
                recordsdata={recordsData} titledata={childCardTitle}></c-lpi-dashboard-table-details>
        </div>
        <span if:true={licensedata}>
            <br>
            <c-lpi-identification-card-table-details onspinnerhandlerfromchild={spinnerHandler}>
            </c-lpi-identification-card-table-details>
        </span>
    </div>
</template>
