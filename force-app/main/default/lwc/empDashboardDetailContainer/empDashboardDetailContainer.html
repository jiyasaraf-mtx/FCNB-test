<template>
    <div class="backdrop" if:true={showSpinner}>
        <div class="spinner">
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </div>
    </div>
    <div class="slds-grid slds-gutters dashboard-details main-dashboard p-t-medium">
   
        <div class={applicationClass}>
            <div class="slds-card" data-tab="application" onclick={fetchApplicationRecords} tabindex="0"
                aria-label="Applications" onkeydown={handleKeyDown1}>
                <div class="icon-block m-b-xml">
                    <i class="material-icon material-icon-application"></i>
                </div>
                <div class="dashboard-card-text">
                    <h2 class="regular-text-18 m-b-xml">Applications</h2>
                    <div class="bold-32">{appCount}</div>
                </div>

            </div>
        </div>
   
    </div>
    <!-- Add warning box -->
    <div class="warning-message-box slds-p-top_none slds-list_horizontal slds-m-top_medium">
        <lightning-icon class=" slds-icon-utility-info-alt slds-icon_container slds-m-right_small"
            icon-name="utility:info_alt" title="Warning">
            <span style="--sds-c-icon-color-background: var(--slds-c-icon-color-background, transparent)"
                part="boundary">
                <lightning-primitive-icon size="medium" variant="">...</lightning-primitive-icon>
                <span class="slds-assistive-text">Warning</span>
            </span>
        </lightning-icon>
        <div if:true={licensedata} class="slds-media__body">
						<div>
								Important Notice
						</div>
            <p>
								Click the eye icon (<lightning-icon icon-name="utility:preview" size="xx-small"></lightning-icon>) for quick access to view and manage your license.
            Click the three dots (<lightning-icon icon-name="utility:threedots_vertical" size="xx-small"></lightning-icon>) for additional online update options.
						</p>
						
        </div>
        <div if:true={applicationdata} class="slds-media__body">
						<div>
								Important Notice
						</div>
						<p>
								To manage your applications or to make any additional actions, click the three dots (<lightning-icon icon-name="utility:threedots_vertical" size="xx-small"></lightning-icon>) in the Action column.
						</p>
        </div>
        <div if:true={paymentdata} class="slds-media__body">
							<div>
								Important Notice
						</div>
           <p>
							 To view your payments, click the eye icon (<lightning-icon icon-name="utility:preview" size="xx-small"></lightning-icon>) in the Action column.
						</p> 
        </div>
    </div>

    <div class='slds-m-vertical_large'>
        <div class="slds-card" if:true={showSection}>
            <div class="dashboard_table_heading">
                <div>
                    <h3 class="semiBold-18">{childCardTitle}</h3>
                </div>
                <div>
                    <lightning-button variant="base" label="View All" title="View All" onclick={handleViewAll} aria-label={viewAllButtonAriaLabel} class="base-link"></lightning-button>
                    <!-- <a title="View All" slot="actions" onclick={handleViewAll} tabindex="0" aria-label={viewAllButtonAriaLabel}>View All</a> -->
                </div>
            </div>
            <c-lpi-dashboard-table-details onchildmethod={callFromChild} paymentdata={paymentdata}
                applicationdata={applicationdata} licensedata={licensedata} columns={Columns}
                recordsdata={recordsData}></c-lpi-dashboard-table-details>
        </div>
        <span if:true={licensedata}>
            <br>
            <c-lpi-identification-card-table-details onspinnerhandlerfromchild={spinnerHandler}>
            </c-lpi-identification-card-table-details>
        </span>
    </div>
</template>
