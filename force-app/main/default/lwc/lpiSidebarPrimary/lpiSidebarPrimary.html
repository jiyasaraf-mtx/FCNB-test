<!--
  @description       : Unified portal sidebar — dynamic tabs by portal context.
-->
<template>
    <!-- Shared Licensing / Employer chrome for all portals -->
    <template if:true={showLpiChrome}>

                            </lightning-menu-subheader>
                            <lightning-menu-divider key={item} if:false={item.Id}></lightning-menu-divider>

                                <lightning-menu-item icon-name="utility:check" name={item.Id} key={item}
                                    if:true={item.showIcon} label={item.Name} value={item.Id}></lightning-menu-item>
                                <lightning-menu-item name={item.Id} key={item} label={item.Name}
                                    if:false={item.showIcon} value={item.Id}></lightning-menu-item>
                            </template>

                        </template>
                    </lightning-button-menu>
                </div>
            </div>

            <ul class="sub-sidebar" id="sub-sidebar">

                                    <li>

                        <!-- AVR Pension Portal tabs -->

                            <div class="slds-m-top_medium slds-m-bottom_medium">

                                    <li>
                                        <a class={pensionListActiveClass} data-page="list" onclick={handlePensionNav} href="javascript:void(0);">

                                                <span>{labels.emailNotifications}</span>
                                            </div>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </template>

                        <!-- Licensing Portal tabs -->

                        </div>
                        <div class="slds-m-top_medium slds-m-bottom_medium">

                                            <img class="slds-p-right_small" src={apps} alt="apps">

                                    <a class={dashboardActive} onclick={handleDashboard} href="javascript:void(0);">

                                            <img class="slds-p-right_small" src={apps} alt="apps">

                                        <lightning-helptext class="slds-p-left_x-small menu-help" content={taskmsg}  icon-name="utility:info_alt" alternative-text={myTaskInfoBtnAriaLabel}>  </lightning-helptext>
                                    </a>

                        <div class="section">
                            <div class="label slds-p-horizontal_large">{labels.certifications}</div>
                            <ul>

                                </li>
                                <li>
                                    <a class={renewActive} onclick={handleRenewLicense} href="javascript:void(0);"><img

                                    <a class={allLicensesActive} onclick={handleAllLicense} href="javascript:void(0);">

                            <ul>

                                    <a class={allApplicationActive} onclick={handleAllApplication}

                                            alt="">All Applications</a>
                                </li> -->

                                <!-- <li>
                                    <a class={allApplicationActive} onclick={handleAll}
                                        href="javascript:void(0);"><img class="slds-p-right_small" src={application}
                                            alt="">All</a>
                                </li> -->

                                            alt="">{labels.myApplications}</a>
                                </li>
                                <!-- <li>
                                    <a class={allPayemntActive} onclick={handleAllPayment} href="javascript:void(0);">
                                        <img class="slds-p-right_small" src={payment} alt="">All Payments
                                    </a>
                                </li> -->

                                    <a class={myPayemntActive} onclick={handlePayment} href="javascript:void(0);">
                                        <img class="slds-p-right_small" src={payment} alt="">{labels.myPayments}
                                    </a>
                                </li>
                                <li>
                                    <a class={myComplaintsActive} onclick={handleMyComplaints} href="javascript:void(0);">

                                        {labels.myComplaints}

                                icon-name="utility:info_alt"
                                ></lightning-helptext>

                            <lightning-button variant="outline-brand" label={labels.authEmployeeContact} class="assocBusiAcc"

    <template if:true={showSelectionModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open lpi-modal slds-modal_medium" onkeydown={escCloseModal}>
            <div class="slds-modal__container">
                <!-- Modal header  -->
                <div class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title={labels.close} onclick={closeSelectionModal}>
                    <lightning-icon icon-name="utility:close" alternative-text={labels.close} variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">{labels.closeSelectAction}</span>
                </button>
                    <h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate">{labels.selectAnAction}</h1>
                </div>
                <!-- Modal body  -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <p class="m-b-medium semiBold-16">{labels.selectActionPrompt}</p>
                    <div class="slds-grid homepage slds-gutters slds-wrap">
                        <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-large-size_4-of-12 anchor-card m-b-large">

                                <div class="anchor-card-body">
                                    <i class="material-icon material-icon-badge"></i>
                                    <h2 class="m-t-large bold-24">{labels.newCertification}</h2>
                                    <p class="text-secondary m-t-xs">{labels.newCertificationDesc}</p>
                                    <i class="material-icon material-icon-arrow_forward"></i>
                                </div>            
                            </a>
                        </div>
                        <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-large-size_4-of-12 anchor-card m-b-large">
                            <a href="Javascript:void(0);" class="selectPersonal" label={labels.preLicensurePetition} onclick={handlePreLicensePetition}>
                                <div class="anchor-card-body">
                                    <i class="material-icon material-icon-PreLicense"></i>
                                    <h2 class="m-t-large bold-24">{labels.preLicensurePetition}</h2>
                                    <p class="text-secondary m-t-xs">{labels.preLicensePetitionDesc}</p>
                                    <i class="material-icon material-icon-arrow_forward"></i>
                                </div>            
                            </a>
                        </div>
                        <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-large-size_4-of-12 anchor-card m-b-large">

                                    <h2 class="m-t-large bold-24">{labels.complaints}</h2>
                                    <p class="text-secondary m-t-xs">{labels.complaintsDesc}</p>
                                    <i class="material-icon material-icon-arrow_forward"></i>
                                </div>            
                            </a>
                        </div>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeSelectionModal} title={labels.cancel}>{labels.cancel}</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
