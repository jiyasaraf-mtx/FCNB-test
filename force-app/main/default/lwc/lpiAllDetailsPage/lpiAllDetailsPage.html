<template>
    <lightning-radio-group name="radioGroup" class="radio-group" 
                options={allDetailsOptions} type="radio" onchange={onOptionChange} value={selectedOption}>
    </lightning-radio-group>
    <template if:true={showApplicationsPage}>
        <c-lpi-all-application-detail-page show-applications="true"></c-lpi-all-application-detail-page>
    </template>
    <template if:true={showLicensesPage}>
      <c-lpi-all-license-detail-page show-licenses ="true"></c-lpi-all-license-detail-page>
    </template>
    <template if:true={showPaymentsPage}>
      <c-lpi-all-payment-detail-page show-payments="true"></c-lpi-all-payment-detail-page>
    </template>
</template>
