<template>
    <template if:true={showSpinner}>
        <lightning-spinner size="medium" alternative-text="Loading..."></lightning-spinner>
    </template>
    <div class="slds-form-element" onmouseleave={toggleResult} data-source="lookupContainer">
        <div class="slds-combobox_container slds-has-selection">
            <label class="slds-form-element__label" for="combobox-id-1"><span
                    class="slds-required">&#42;</span>
                    {label}
                </label>
            <div class="lookupInputContainer slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right" role="none">
                    <div class="searchBoxWrapper slds-show">
                        <!--Lookup Input Field-->
                        <lightning-input type="search" data-source="searchInputField" onclick={toggleResult} onkeypress={toggleResult}
                            onchange={handleKeyChange} is-loading={isSearchLoading} value={searchKey}
                            variant="label-hidden" placeholder="Search License Here..." required aria-live="assertive" aria-atomic="true"
                            class="combobox_input" onkeydown={changeAriaLabel} aria-label={searchAriaLabel} message-when-value-missing={missingLabel}></lightning-input>
                    </div>

                    <!--Lookup Selected record pill container start-->
                    <div class="pillDiv slds-hide">
                        <lightning-input type="text" value={selectedRecord.TypeAheadKey} id="combobox-id-1"
                             disabled variant="label-hidden"></lightning-input>
                    </div>
                </div>

                <!-- lookup search result part start-->
                <div style="margin-top:0px" id="listbox-id-5"
                    class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox"
                    onmousedown={preventFocusLosing}>
                    <ul class="slds-listbox slds-listbox_vertical" role="presentation" onkeydown={handleKeyDownFocus}>
                        <template for:each={lstResult} for:item="obj">
                            <li key={obj.Id} role="presentation" class="slds-listbox__item li-ariafocus" tabindex="-1" data-recid={obj.Id} aria-live="assertive" aria-label={searchAriaLabel}>
                                <div data-recid={obj.Id} onclick={handelSelectedRecord} onmousedown={handelSelectedRecord}
                                    class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                    role="option">
                                    <span style="pointer-events: none;" class="slds-media__body">
                                        <span
                                            class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.TypeAheadKey}</span>
                                    </span>
                                </div>
                            </li>
                        </template>
                        <!--ERROR msg, if there is no records..-->
                        <template if:false={hasRecords}>
                            <li class="slds-listbox__item" style="text-align: center; font-weight: bold;">No Records
                                Found....</li>
                        </template>
                    </ul>

                </div>
            </div>
        </div>
    </div>
</template>
