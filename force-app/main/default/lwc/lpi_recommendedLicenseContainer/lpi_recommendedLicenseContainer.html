<template>
    <div class="backdrop" if:true={showSpinner} >
        <div class="spinner" >
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </div>
    </div>
    <div class="slds-grid slds-wrap slds-p-around_x-small slds-m-bottom_x-small modpr-licenselist-container">
        <div class="slds-col slds-p-around_x-small modpr-license-list slds-large-size_9-of-12 slds-medium-size_12-of-12 slds-small-size_12-of-12 slds-size_12-of-12">
            <div class="slds-grid slds-wrap slds-m-bottom_x-small">
                <div class="slds-col bordered_radio slds-p-right_small slds-m-bottom_xx-small slds-large-size_12-of-12 slds-medium-size_12-of-12 slds-small-size_12-of-12 slds-size_12-of-12">
                    <lightning-radio-group
                        options={filterRegType}
                        value={selectedRegType}
                        onchange={handleSelectedRegType}
                        type="radio"
                        style="display:inline-block !important"
                        class="focus-helper" >
                    </lightning-radio-group>
                </div>
            </div>
            <div class="slds-grid slds-wrap search-wrap">
                <div class="slds-col slds-p-around_x-small icon-align search-input slds-large-size_8-of-12 slds-medium-size_6-of-12 slds-small-size_6-of-12 slds-size_6-of-12">
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-p-right_small custom-lable-hidden search-box slds-size_12-of-12">
                            <lightning-input
                                type="text" 
                                class="license-searchbox-input" 
                                placeholder={searchAriaLabelLicense}
                                variant="label-hidden"
                                onchange={searchLicenseAction} 
                                value={licenseNameSearch}
                            ></lightning-input>
                        </div>
                        <!-- <div class="slds-col slds-text-align_center icon-align search-button slds-size_1-of-12">
                            <lightning-icon icon-name="utility:search"  alternative-text="Search License" title="Search License" size="x-small"></lightning-icon>
                        </div> -->
                    </div>
                </div>
                <div class="slds-col slds-p-around_x-small icon-align sort-button slds-large-size_2-of-12 slds-medium-size_3-of-12 slds-small-size_6-of-12 slds-size_6-of-12">
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-text-align_center icon-align slds-size_3-of-12">
                            <lightning-button-icon  variant="base" icon-name="utility:arrowdown" data-id="desc"  alternative-text="Sort elements in descending order" title={sortingDescAriaLabel} onclick={sortTheData}></lightning-button-icon>
                        </div>
                        <div class="slds-col slds-text-align_center icon-align slds-size_3-of-12">
                            <lightning-button-icon  variant="base" icon-name="utility:arrowup" data-id="asc" alternative-text="Sort elements in ascending order" title={sortingAscAriaLabel} onclick={sortTheData}></lightning-button-icon>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-text-align_center icon-align clear-filter-button slds-large-size_2-of-12 slds-medium-size_3-of-12 slds-small-size_6-of-12 slds-size_6-of-12">
                    <lightning-button variant="base" label="Clear Filter" title="Clear Filter" onclick={clearFilterAction} class="slds-m-left_x-small"></lightning-button>
                </div>
            </div>
            <div class="slds-col slds-p-around_x-small slds-m-top_small slds-size_12-of-12">
                <div><span style="color: #e03e2d;">*</span> Please note credit/debit card transactions will incur a processing fee.</div>
            </div>
            <template for:each={mainRegList} for:item="regType" for:index="index">
                <div class="slds-col slds-size_12-of-12 slds-m-top_large" key={regType.id}>
                    <div class="slds-grid slds-wrap slds-card slds-p-around_x-small slds-m-bottom_x-small landing-card">
                        <div class="slds-col slds-p-around_x-small card-details slds-large-size_9-of-12 slds-medium-size_12-of-12 slds-small-size_12-of-12 slds-size_12-of-12">
                            <div class="slds-grid slds-wrap">
                                <div class="slds-col domain info-card slds-size_12-of-12">
                                    <span><div>{regType.issuingDepartmentName}</div></span>
                                </div>
                                <div class="slds-col sub-heading slds-size_12-of-12">
                                    <span class="field-value" title={regType.name}>{regType.name}</span>
                                </div>
                                <div class="slds-col know-more-accordion slds-size_12-of-12 condition-element" if:true={regType.showKnowMore}>
                                    <div class={regType.knowMoreClassName}>
                                        <h3 class="slds-section__title">
                                          <button aria-label={regType.knowMoreAriaLabel} onclick={knowMoreHandler} data-id={index} aria-controls="expando-unique-id" aria-expanded={regType.knowMoreIsOpen} class="slds-button slds-section__title-action">
                                            <lightning-icon icon-name={regType.knowMoreIconName} size="x-small"></lightning-icon>
                                            <span class="slds-truncate" title="Know more">Know more</span>
                                          </button>
                                        </h3>
                                        <div aria-hidden="false" class="slds-section__content">
                                            <lightning-formatted-rich-text
                                            value={regType.howToApply}
                                        ></lightning-formatted-rich-text>
                                          
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-col slds-p-around_x-small view-button slds-large-size_3-of-12 slds-medium-size_12-of-12 slds-small-size_12-of-12 slds-size_12-of-12">
                            <div class="secondary-button">
                                <button aria-label={regType.ariaLabelLicense} class="slds-button slds-button_outline-brand" data-id={regType.id} onclick={handleApplyOnline}>Apply Online</button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
          
        </div>
        <div class="slds-col slds-p-around_x-small modpr-board-list slds-large-size_3-of-12 slds-medium-size_12-of-12 slds-small-size_12-of-12 slds-size_12-of-12">
            <div class="slds-grid slds-wrap slds-card slds-p-around_x-small slds-m-bottom_x-small">
                <div class="slds-col icon-position slds-size_12-of-12">
                    <section  class={className}>
                        <div  class="slds-accordion__summary">
                            <h2 class="slds-accordion__summary-heading">
                                <button class="slds-button slds-section__title-action"  aria-expanded={isOpen} onclick={handleToggleAccordionClick}>
                                    <lightning-icon icon-name={icon} size="x-small" ></lightning-icon>
                                    <span class="slds-truncate" title="Board">Board</span>
                                </button>
                            </h2>
                        </div>
                        <div class="slds-accordion__content">
                            <div class="slds-grid slds-wrap">
                                <div class="slds-grid slds-wrap slds-m-top_medium">
                                    <div><strong>Select a Board</strong></div>
                                </div>
                                <div class="slds-col slds-p-around_x-small slds-m-top_medium custom-search slds-size_12-of-12">
                                    <div class="board-searchbox d-flex center between">
                                        <lightning-input  type="text"  value={baordSearchName} class="board-searchbox-input"  placeholder={searchAriaLabelBoard} variant="label-hidden" onchange={handleBoardChangeAction}></lightning-input>
                                        <!-- <span class="search-button slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                                            <lightning-icon icon-name="utility:search"  alternative-text="Search Board" title="Search Board" size="x-small"></lightning-icon>
                                        </span> -->
                                    </div>
                                </div>
                                <div class="slds-col slds-size_12-of-12 Category-list">
                                    <ul class="slds-has-dividers_bottom slds-has-block-links_space">
                                        <template for:each={boardList} for:item="board">
                                            <li class="slds-item slds-action_item" key={board}>
                                            <a tab-index="0" role="button" onclick={handleSelectedBoard} data-id={board} href="javascript: void(0)">{board}</a>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</template>
