<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                    onclick={closeLicensureVerificationModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                        size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h1 id="modal-heading-03" class="slds-text-heading_medium slds-hyphenate">Verification of Licensure</h1>
            </header>
            <div if:true={showSpinner}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
            <div class="slds-modal__content slds-p-around_medium">
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_12-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                        <div class="input-group">
                            <c-custom-look-up from-institution="true" icon-name="standard:custom" name="institution"
                                label="Institution Name" onlookupupdate={lookupRecord}
                                placeholder="Search Institution Name here..." search-required="true"
                                minimum-length-required="3" onlookupremove={handleRemoveInstitution}></c-custom-look-up>
                        </div>
                    </div>
                    <!--Read only Lookup Fields start-->
                    <template if:true={showDisabledFields}>
                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                            <div class="input-group">
                                <lightning-input name="instituteName" label="Institution Name"
                                    value={institutionRec.InstitutionName} disabled></lightning-input>
                            </div>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                            <div class="input-group">
                                <lightning-input name="instituteStreet" label="Street" value={institutionRec.Street}
                                    disabled></lightning-input>
                            </div>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                            <div class="input-group">
                                <lightning-input name="instituteCity" label="City" value={institutionRec.City}
                                    disabled></lightning-input>
                            </div>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                            <div class="input-group">
                                <lightning-input name="instituteState" label="State" value={institutionRec.State}
                                    disabled></lightning-input>
                            </div>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                            <div class="input-group">
                                <lightning-input name="instituteCounty" label="Country" value={institutionRec.Country}
                                    disabled></lightning-input>
                            </div>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                            <div class="input-group">
                                <lightning-input name="instituteZipCode" disabled value={institutionRec.Zipcode}
                                    label="Zip Code"></lightning-input>
                            </div>
                        </div>
                    </template>
                    <!--Read only Lookup Fields end-->
                    <div class="slds-col slds-size_12-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                        <div class="input-group">
                            <lightning-combobox name="requestType" label="Request Type" class="wf-input-box"
                                dropdown-alignment="auto" placeholder="-Select-"
                                message-when-value-missing="Error: Request Type is required."
                                options={requestTypeOptions} onchange={handleChange} value={requestData.requestType}
                                required>
                            </lightning-combobox>
                        </div>
                    </div>
                    <div class="slds-col slds-size_12-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                        <div class="input-group">
                            <lightning-input type="checkbox"
                                label="The Applicant's license is in good standing and NO disciplinary charges are pending against said licensee."
                                name="licenseGoodStanding" checked={requestData.licenseGoodStanding}
                                onchange={handleChange}>
                            </lightning-input>
                        </div>
                    </div>
                    <div class="slds-col slds-size_12-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                        <div class="input-group">
                            <lightning-input type="checkbox"
                                label="Disciplinary charges or actions imposed/pending against license."
                                name="disciplinaryActionImposed" checked={requestData.disciplinaryActionImposed}
                                onchange={handleChange}>
                            </lightning-input>
                        </div>
                    </div>
                </div>
            </div>
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral"
                    onclick={closeLicensureVerificationModal}>Cancel</button>
                <button class="slds-button slds-button_brand"
                    onclick={handleLicensureVerificationGenerate}>Generate</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>

</template>
