<template>
    <div class="slds-grid slds-grid--align-spread">
        <div class="bold-18">New License Application
            <template if:true={isTypeRenewalOrAmend}>
                <div class="slds-m-left_small">
                    <b>License Number:</b> {licenseNumber}
                </div>
                <div class="slds-m-left_small">
                    <b>Application SubType:</b> {subType}
                </div>
            </template>
        </div>
        <a tabindex="0" class=" link-text" href="javascript:void(0);" onclick={handleLinkClick} if:true={showInstruction}
         aria-label="Open Instructions in New Tab, this link will open in new tab">
            <span>Open Instructions in New Tab &nbsp;</span>
            <lightning-icon icon-name="utility:new_window"  alternative-text="new window" variant="inverse" size="x-small">
            </lightning-icon>
        </a>
    </div>
