<template>
    <template if:true={showSpinner}>
        <lightning-spinner size="medium" alternative-text="Loading..."></lightning-spinner>
    </template>
    <template if:false={isReview}>
        <span>Enter details of all the Funeral Establishments that you are associated with.</span>
        <div class="householdmem">
            <div for:each={itemList} for:item="item" key={item} for:index="index">
                <lightning-accordion active-section-name={item.label} allow-multiple-sections-open class="outerAccordion">
                    <lightning-accordion-section name={item.label} label={item.label}>
                        <h3 class="slds-m-top_x-large slds-m-bottom_medium app-flow-subheading">
                            ESTABLISHMENT INFORMATION
                        </h3>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <c-lpi-custom-lookup-establishment label="Establishment License Number" missing-label="Error: Establishment License Number is required."
                                    onlookupupdate={lookupRecord} dat-id=''
                                    is-establishment={booleanTrue} is-child={booleanFalse} parent-id={item.serialNumber}
                                    value={item.establishmentLicNo}>
                                </c-lpi-custom-lookup-establishment>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input type="text" label="Establishment Name" disabled
                                    name='establishmentName' data-id={item.serialNumber} value={item.establishmentName}
                                    onchange={handleInput}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input type="text" disabled label="Street Address"
                                    name="billingStreet" value={item.billingStreet}
                                    onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" disabled label="City"
                                    name="billingCity" value={item.billingCity}
                                    onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  name="billingState" disabled
                                    label="State" value={item.billingState} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" disabled label="Zip Code"
                                    name="billingPostalCode" minlength="5" maxlength="10"
                                    value={item.billingPostalCode} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" label="Establishment Telephone Number"
                                    name="phone" disabled value={item.phone} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" label="Funeral Director In Charge" disabled
                                    name="inchargeName" value={item.inchargeName} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" label="Funeral Director In Charge License Number" disabled
                                    name="inchargeLicNumber" value={item.inchargeLicNumber} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="date" label="Date Relationship Began Or Will Begin With Establishment"
                                    name="beginDate" value={item.beginDate} onchange={handleChange}
                                    data-parentid={item.serialNumber} date-style="short">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1">
                                <template if:false={item.isDisable}>
                                    <lightning-input type="checkbox" 
                                        label="The board's records reflect the relationship listed below is the current relationship that is on record for you. In order for the board to update our records, please indicate by checking Yes or No if this relationship is associated with you."
                                        name="relationshipAssociatedWithYou" data-parentid={item.serialNumber}
                                        checked={item.relationshipAssociatedWithYou} onchange={handleChange}>
                                    </lightning-input>
                                </template>
                            </div>
                            <template lwc:if={displayEmbalmerSection}>
                                <div class="slds-col slds-size_1-of-1">
                                    <p>
                                        <template lwc:if={isEmbalmerPracticum}>
                                            <lightning-formatted-text value="Please enter the name of the licensed embalmer who will served as our embalmer practicum instructor at this funeral establishment.">
                                            </lightning-formatted-text>
                                        </template>
                                        <template lwc:else>
                                            <lightning-formatted-text value="Please enter the name of the licensed supervisor(s) that will supervise you during your apprenticeship at this funeral establishment" >
                                            </lightning-formatted-text>
                                        </template>
                                    </p>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                    <lightning-button label="Add Supervisor"
                                        icon-name="utility:add" slot="actions" data-parentid={item.serialNumber}
                                        onclick={addChildSection} variant="neutral">
                                    </lightning-button>
                                </div>
                            </template>
                        </div>
                        <template if:true={displayEmbalmerSection}>
                            <h2 if:true={item.embalmerDetailList.length} class="slds-m-top_medium">Supervisor Details
                            </h2>
                            <div for:each={item.embalmerDetailList} for:item="eachIncome" key={eachIncome}
                                for:index="index">
                                <lightning-accordion active-section-name={eachIncome.label} allow-multiple-sections-open
                                data-id={item.key} class="innerAccordion">
                                <lightning-accordion-section name={eachIncome.label} label={eachIncome.label}>
                                        <lightning-button class="del-btn income" label="Delete Supervisor"
                                            icon-name="utility:delete" slot="actions" data-parentid={item.serialNumber}
                                            data-id={eachIncome.serialNumber} onclick={deleteChildData}
                                            variant="destructive">
                                        </lightning-button>
                                        <div class="slds-grid slds-wrap slds-gutters">
                                            <div class="slds-col slds-size_6-of-12">
                                                <c-lpi-custom-lookup-establishment label="Supervisor License No" missing-label="Error: Supervisor License No is required."
                                                    onlookupupdate={lookupRecord} dat-id=''
                                                    aria-label="Supervisor License No" is-establishment={booleanTrue}
                                                    is-child={booleanTrue} parent-id={item.serialNumber}
                                                    child-id={eachIncome.serialNumber} value={eachIncome.embalmerLicNo}
                                                    is-disable={booleanTrue}></c-lpi-custom-lookup-establishment>
                                                <lightning-input type="text" disabled name="embalmerName"
                                                    value={eachIncome.embalmerName} label='Supervisor Name'
                                                    data-parentid={item.serialNumber} data-id={eachIncome.serialNumber}
                                                    onchange={handleChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </lightning-accordion-section>

                                </lightning-accordion>
                            </div>
                        </template>

                        <template if:false={item.hideDelete}>
                            <lightning-button label="Delete Establishment " class="del-btn house" slot="actions"
                                data-parentid={item.serialNumber} value={index} name={item.label} onclick={handleDelete}
                                variant="destructive" icon-name="utility:delete">
                            </lightning-button>
                        </template>
                    </lightning-accordion-section>
                </lightning-accordion>
            </div>
            <lightning-button label="Add Another Establishment" class="m-t-5" slot="actions" onclick={handleAddRow}
                variant="brand" icon-name="utility:add"></lightning-button>
            <div class="save-m-btn" style="text-align: end;">
                <lightning-button label="Save & Next" onclick={handleSave} variant="brand"></lightning-button>
            </div>
        </div>
    </template>
    <template if:true={isReview}>
        <span>Details of all the Funeral Establishments that you are associated with.</span>
        <div class="householdmem">
            <div for:each={itemList} for:item="item" key={item} for:index="index">
                <lightning-accordion active-section-name={item.label} allow-multiple-sections-open  class="outerAccordion">
                    <lightning-accordion-section name={item.label} label={item.label}>
                        <h3 class="slds-m-top_x-large slds-m-bottom_medium app-flow-subheading">
                            ESTABLISHMENT INFORMATION
                        </h3>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <c-lpi-custom-lookup-establishment label="Establishment License Number"
                                    onlookupupdate={lookupRecord} dat-id=''
                                    is-establishment={booleanTrue} is-child={booleanFalse} parent-id={item.serialNumber}
                                    value={item.establishmentLicNo}>
                                </c-lpi-custom-lookup-establishment>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input type="text" label="Establishment Name" disabled
                                    name='establishmentName' data-id={item.serialNumber} value={item.establishmentName}
                                    onchange={handleInput}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" disabled label="Street Address"
                                    name="billingStreet" value={item.billingStreet}
                                    onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" disabled label="City"
                                    name="billingCity" value={item.billingCity}
                                    onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  name="billingState" disabled
                                    label="State" value={item.billingState} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" disabled label="Zip Code"
                                    name="billingPostalCode" minlength="5" maxlength="10"
                                    value={item.billingPostalCode} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" label="Establishment Telephone Number"
                                    name="phone" disabled value={item.phone} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" label="Funeral Director In Charge" disabled
                                    name="inchargeName" value={item.inchargeName} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input  type="text" label="Funeral Director In Charge License Number" disabled
                                    name="inchargeLicNumber" value={item.inchargeLicNumber} onchange={handleChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12">
                                <lightning-input type="date" label="Date Relationship Began Or Will Begin With Establishment" date-style="short" name="beginDate"
                                    value={item.beginDate} onchange={handleChange} data-parentid={item.serialNumber}
                                     disabled>
                                </lightning-input>
                            </div>
                            <template if:false={item.isDisable}>
                                <div class="slds-col slds-size_1-of-1">
                                    <lightning-input type="checkbox"
                                        label="The board's records reflect the relationship listed below is the current relationship that is on record for you. In order for the board to update our records, please indicate by checking Yes or No if this relationship is associated with you."
                                        name="relationshipAssociatedWithYou" data-parentid={item.serialNumber}
                                        checked={item.relationshipAssociatedWithYou} onchange={handleChange} disabled>
                                    </lightning-input>
                                </div>
                            </template>
                        </div>
                        <template if:true={displayEmbalmerSection}>
                            <h2 if:true={item.embalmerDetailList.length} class="slds-m-top_medium">Supervisor Details
                            </h2>
                            <div for:each={item.embalmerDetailList} for:item="eachIncome" key={eachIncome}
                                for:index="index">
                                <lightning-accordion active-section-name={eachIncome.label} allow-multiple-sections-open
                                    data-id={item.key} class="innerAccordion">
                                    <lightning-accordion-section name={eachIncome.label} label={eachIncome.label}>
                                        <div class="slds-grid slds-wrap slds-gutters">
                                            <div class="slds-col slds-size_6-of-12">
                                                <c-lpi-custom-lookup-establishment label="Supervisor License No"
                                                    onlookupupdate={lookupRecord} dat-id=''
                                                    placeholder="Search License here..." is-establishment={booleanTrue}
                                                    is-child={booleanTrue} parent-id={item.serialNumber}
                                                    child-id={eachIncome.serialNumber} value={eachIncome.embalmerLicNo}
                                                    is-disable={booleanFalse}></c-lpi-custom-lookup-establishment>
                                                <lightning-input type="text" disabled name="embalmerName"
                                                    value={eachIncome.embalmerName} label='Supervisor Name'
                                                    data-parentid={item.serialNumber} data-id={eachIncome.serialNumber}
                                                    onchange={handleChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </lightning-accordion-section>

                                </lightning-accordion>
                            </div>
                        </template>
                    </lightning-accordion-section>
                </lightning-accordion>
            </div>
        </div>
    </template>
</template>
