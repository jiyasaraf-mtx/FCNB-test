<template>
	<div class="slds-form-element slds-has-error label slds-m-bottom_medium" >
		<lightning-combobox
		name="AddressType"
		label="Address Type"
		value={value}
		placeholder="Select Address Type"
		options={options}
		onchange={handleChange}
		readonly={showedit}
		message-when-value-missing="Error: Address Type is required."
		required
		></lightning-combobox>
	</div>
</template>
