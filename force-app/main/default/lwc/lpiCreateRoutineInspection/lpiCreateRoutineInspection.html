<template>
    <div if:true={showSpinner} class="slds-align_absolute-center">
        <lightning-spinner size="medium" alternative-text="Loading..."></lightning-spinner>
    </div>
    <div class="main-container">
        <header class="slds-modal__header">
            <h2 class="slds-text-heading_medium slds-hyphenate">Generate Routine Inspections</h2>
        </header>
        <div class="slds-grid slds-wrap slds-align_absolute-center slds-p-around_medium ">
            <div class="slds-col slds-size_12-of-12 slds-p-horizontal_medium slds-m-bottom_small">
                <p class="slds-truncate s" style="text-align: center;">Are you sure you want to create Routine
                    Inspections for this board?</p>
            </div>
        </div>
    </div>

    <footer class="slds-modal__footer slds-align_absolute-center">
        <button class="slds-button slds-button_brand" style="width: 9rem;"
            onclick={createRoutineInspectionsRecords}>Yes</button>
    </footer>
</template>
