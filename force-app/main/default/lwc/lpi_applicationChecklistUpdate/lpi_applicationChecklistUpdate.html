<template>
    <div if:true={showSpinner}>
		<lightning-spinner size="medium" alternative-text="Loading"></lightning-spinner>
	</div>
    <div class="licenses-details" if:true={showList}>
        <lightning-card>
            <div class="slds-text-align_right slds-m-top_medium">
                <lightning-button variant="brand" label="Save All" class="" disabled={allDisabled} onclick={handleSaveAll}></lightning-button>
            </div>
            <ul class="slds-accordion">
                <template for:each={checklistData} for:item="item" for:index="ind">
                    <div key={item.headingName} class="slds-text-heading_small">
                        <b>{item.headingName}</b>
                    </div>
                    <div class="container-table slds-m-top_x-small slds-m-bottom_large"  key={item.headingName}>
                        <table class="slds-table slds-table_bordered slds-border_left slds-border_right ">
                                <thead>
                                <tr class="slds-line-height_reset">
                                    <template for:each={item.columnName} for:item="col">
                                        <th class="" scope="col"  key={col}>
                                            <div style="white-space: break-spaces;width: 100%;" class="" title={col}>{col}</div>
                                        </th>
                                    </template>
                                    <th class="" scope="col" style="width:6rem">
                                        <div class="slds-text-align_center" title="Action">Action</div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={item.recordValues} for:item="record">
                                    <tr class="slds-hint-parent" key = {record}>
                                        <template for:each={record.valueList} for:item="val1">
                                            <td key={val1.value} if:true={val1.isText}>
                                                <div class="slds-cell-wrap">
                                                    <lightning-input 
                                                    value={val1.value} 
                                                    type="text" 
                                                    variant="label-hidden"
                                                    onchange={handleChange}
                                                    data-id={record.id}
                                                    data-objname={item.objName}
                                                    required={val1.isRequired}
                                                    disabled={allDisabled}
                                                    data-apiname={val1.apiName} ></lightning-input>
                                                </div>
                                            </td>
                                            <td key={val1.value} if:true={val1.isDate} class="date-field">
                                                <div class="slds-cell-wrap">
                                                    <lightning-input data-id={record.id} required={val1.isRequired} data-apiname={val1.apiName}
                                                    value={val1.value} onchange={handleChange}
                                                    data-objname={item.objName}
                                                    disabled={allDisabled}
                                                    date-style="short"
                                                    type="date" variant="label-hidden"></lightning-input>
                                                </div>
                                            </td>
                                            <td key={val1.value} if:true={val1.isPicklist} style="width: 10rem;">
                                                <div class="slds-cell-wrap">
                                                    <lightning-combobox
                                                        required={val1.isRequired}
                                                        data-objname={item.objName}
                                                        data-id={record.id}
                                                        variant="label-hidden"
                                                        value={val1.value}
                                                        onchange={handleChange}
                                                        disabled={allDisabled}
                                                        options={val1.picklistValues}
                                                        data-apiname={val1.apiName}
                                                        dropdown-alignment="top-right"
                                                         ></lightning-combobox>
                                                </div>
                                            </td>
                                            <td key={val1.value} if:true={val1.isCheckbox}>
                                                <div class="slds-cell-wrap" if:true={record.showRespectiveSave}>
                                                    <lightning-input checked disabled={allDisabled} required={val1.isRequired} data-objname={item.objName} onchange={handleChange} data-apiname={val1.apiName} data-id={record.id} type="checkbox"  variant="label-hidden"></lightning-input>
                                                </div>
                                                <div class="slds-cell-wrap" if:false={record.showRespectiveSave}>
                                                    <lightning-input  required={val1.isRequired} disabled={allDisabled} data-objname={item.objName} onchange={handleChange} data-apiname={val1.apiName} data-id={record.id}  type="checkbox"  variant="label-hidden"></lightning-input>
                                                </div>
                                            </td>
                                            <td key={val1.value} if:true={val1.isValue}>
                                                <div if:true={val1.isLookup} >
                                                    <div class="slds-cell-wrap">
                                                        <a onclick={navigateToRecordViewPage} data-lookup={val1.lookupId}>{val1.value}</a>
                                                    </div>
                                                </div>
                                                <div if:false={val1.isLookup}>
                                                    <div class="slds-cell-wrap">{val1.value}</div>
                                                </div>
                                            </td>
                                        </template>
                                        <td data-label="Action">
                                            <div class="slds-cell-wra slds-text-align_center">
                                                <lightning-button variant="Neutral" label="View" data-ind={ind} data-objname={item.objName} data-recordid={record.id} onclick={handleViewButtton} class="slds-m-bottom_small"></lightning-button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </ul>
            <div class="slds-text-align_right slds-m-vertical_medium">
                <lightning-button variant="brand" label="Save All" class="" disabled={allDisabled} onclick={handleSaveAll}></lightning-button>
            </div>
        </lightning-card>
    </div>
    <div  if:false={showList}>
        <div class="slds-illustration slds-illustration_large">
            <div class="slds-text-longform">
                <img src={noDataFound} alt="">
                <h3 class="slds-text-heading_medium">There are No Records to Approve</h3>
              </div>
        </div>
        <!-- <span><b><center>There are No Records to Approve</center></b></span> -->
    </div>
     <template if:true={showViewModal}>
		<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
			aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close" onclick={hideViewModalBox}>
						<lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
							size="small"></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h1 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">View Form
                    </h1>
				</header>
				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-record-form 
                            record-id={selectedRecordId}
                            object-api-name={selectedObjectName}
                            mode="readonly"
                            fields={viewFields}
                            columns ="3"
                            >
                            </lightning-record-form>
				</div>
                <footer class="slds-modal__footer" if:true={showApproveButton}>
                    <lightning-button variant="brand" disabled={allDisabled} label="Reject" title="Reject" onclick={handleRejectButtton} class="slds-m-left_x-small"></lightning-button>
                    <lightning-button variant="brand" label="Approve" disabled={allDisabled} title="Approve" onclick={handleApproveButtton} class="slds-m-left_x-small"></lightning-button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>
    
</template>
