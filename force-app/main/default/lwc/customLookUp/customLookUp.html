<template>
  <div if:true={showSpinner}>
		<lightning-spinner size="medium" alternative-text="Loading"></lightning-spinner>
	</div>
  <div class="slds-form-element" data-source="lookupContainer">
    <div class="slds-combobox_container slds-has-selection">
      <label if:true={searchRequired} class="slds-form-element__label" for="combobox-id-1">
        <span class="slds-required">*</span>{label}</label>
      <label if:false={searchRequired} class="slds-form-element__label" for="combobox-id-1">{label}</label>
      <div class="lookupInputContainer slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
        aria-expanded="false" aria-haspopup="listbox" role="combobox">
        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right" role="none">
          <div class="searchBoxWrapper slds-show">
            <!--Lookup Input Field-->
            <template if:true={searchRequired}>
              <lightning-input type="search" data-source="searchInputField"
                onchange={handleKeyChange} is-loading={isSearchLoading} value={searchKey} variant="label-hidden"
                placeholder={placeholder} lwc:ref="searchRef" required></lightning-input>
            </template>
            <template if:false={searchRequired}>
              <lightning-input type="search" data-source="searchInputField"
                onchange={handleKeyChange} is-loading={isSearchLoading} value={searchKey} variant="label-hidden"
                placeholder={placeholder}></lightning-input>
            </template>
          </div>

          <!--Lookup Selected record pill container start-->
          <div class="pillDiv slds-hide">
            <span class="slds-icon_container slds-combobox__input-entity-icon">
              <lightning-icon icon-name={iconName} size="x-small" alternative-text="icon"></lightning-icon>
            </span>
            <input type="text" id="combobox-id-1" value={selectedRecord.Name}
              class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
            <button if:false={editremove} class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
              title="Remove selected option">
              <lightning-icon icon-name="utility:close" size="x-small" alternative-text="close icon"
                onclick={handleRemove}></lightning-icon>
            </button>
          </div>
        </div>

        <!-- lookup search result part start-->
        <div style="margin-top:0px" id="listbox-id-5"
          class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
          <ul class="slds-listbox slds-listbox_vertical" role="presentation">
            <template for:each={lstResult} for:item="obj">
              <li key={obj.Id} role="presentation" class="slds-listbox__item">
                <div data-recid={obj.Id} onclick={handelSelectedRecord}
                  class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                  role="option">
                  <span style="pointer-events: none;" class="slds-media__figure slds-listbox__option-icon">
                    <span class="slds-icon_container">
                      <lightning-icon icon-name={iconName} size="small" alternative-text="icon"></lightning-icon>
                    </span>
                  </span>
                  <span style="pointer-events: none;" class="slds-media__body">
                    <span class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Name}</span>
                  </span>
                </div>
              </li>
            </template>
            <template if:true={showAddNewOption}>
              <li role="presentation" class="slds-listbox__item" data-id="add" onclick={lookupAddRecordSelection}>
                <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                  role="option" data-id="addRecord">
                  <span class="slds-media__figure slds-listbox__option-icon" data-id="addRecord">
                    <lightning-icon icon-name="utility:add" size="small" data-id="addRecord">
                    </lightning-icon>
                  </span>
                  <span class="slds-media__body" data-id="addRecord" style="padding-top: 0.7%;">
                    <span class=" slds-listbox__option-text_entity" data-id="addRecord">{addLabel}</span>
                    <span class="slds-listbox__option-meta" data-id="addRecord"></span>
                  </span>
                </div>
              </li>
            </template>
            <!--ERROR msg, if there is no records..-->
            <template if:false={hasRecords}>
              <li class="slds-listbox__item" style="text-align: center; font-weight: bold;">No Records Found....</li>
            </template>
          </ul>

        </div>
      </div>
    </div>
  </div>
</template>
