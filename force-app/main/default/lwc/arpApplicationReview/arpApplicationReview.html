<template>
    <div class="ar-root">
        <div if:true={isLoading} class="spinner-overlay" role="status" aria-live="polite">
            <lightning-spinner alternative-text={labels.loadingQueue}></lightning-spinner>
        </div>

        <template if:true={hasLoadError}>
            <div class="state-banner error" role="alert">{loadError}</div>
        </template>

        <section class="workspace workspace-full">
            <div class="panel">
                <div class="head">
                    <div>
                        <div class="eyebrow">
                            <button type="button" class="back-link" onclick={handleBack}>{labels.queueTitle}</button>
                            › <span>{detailCrumb}</span>
                        </div>
                        <div class="ptitle">{labels.detailTitle}</div>
                    </div>
                    <div class="actions">
                        <button
                            class="btn btn-warning"
                            type="button"
                            onclick={handleRmiTop}
                            disabled={isRmiDisabled}
                        >
                            {labels.returnMoreInfo}
                        </button>
                        <button
                            class="btn btn-success"
                            type="button"
                            onclick={handleApproveTop}
                            disabled={actionsDisabled}
                        >
                            {labels.approve}
                        </button>
                        <button
                            class="btn btn-danger"
                            type="button"
                            onclick={handleRejectTop}
                            disabled={actionsDisabled}
                        >
                            {labels.reject}
                        </button>
                    </div>
                </div>
                <div class="detail">
                    <template if:true={showAlert}>
                        <div class={alertClass} role="alert">{alertMessage}</div>
                    </template>

                    <template if:true={hasSelection}>
                        <div class="cards">
                            <div class="card card-applicant">
                                <h3>{labels.applicantInformation}</h3>
                                <div class="kv">
                                    <div class="k">{labels.applicationNumber}</div><div class="v">{selectedApp.applicationNumber}</div>
                                    <div class="k">{labels.applicantName}</div><div class="v">{selectedApp.applicantName}</div>
                                    <div class="k">{labels.dob}</div><div class="v">{selectedApp.dateOfBirth}</div>
                                    <div class="k">{labels.email}</div><div class="v">{selectedApp.email}</div>
                                    <div class="k">{labels.phone}</div><div class="v">{selectedApp.phone}</div>
                                    <div class="k">{labels.licenceType}</div><div class="v">{selectedApp.licenceType}</div>
                                </div>
                            </div>

                            <div class="card card-docs">
                                <h3>{labels.documentReview}</h3>
                                <div class="checks">
                                    <template if:true={hasDocuments}>
                                        <template for:each={documentRows} for:item="doc">
                                            <div key={doc.key} class="check">
                                                <span class="checkmark" aria-hidden="true">✓</span>
                                                <div class="doc-body">
                                                    <strong>{doc.label}</strong>
                                                    <template if:true={doc.fileName}>
                                                        <br />
                                                        <span class="small doc-filename">{doc.fileName}</span>
                                                    </template>
                                                    <template if:true={doc.contentDocumentId}>
                                                        <div class="doc-actions">
                                                            <span class="doc-action-sep" aria-hidden="true">·</span>
                                                            <button
                                                                type="button"
                                                                class="linkbtn"
                                                                data-action="download"
                                                                data-content-id={doc.contentDocumentId}
                                                                data-url={doc.downloadUrl}
                                                                onclick={handleDocumentAction}
                                                            >
                                                                {labels.download}
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={hasDocuments}>
                                        <div class="doc-empty">{labels.noDocumentsUploaded}</div>
                                    </template>
                                </div>
                            </div>

                            <div class="card card-review">
                                <h3>{labels.reviewSummary}</h3>
                                <template if:true={hasReviewSummary}>
                                    <div class="review-summary-host">
                                        <c-intake-form-review-summary
                                            key={reviewSummaryKey}
                                            title=""
                                            form-data={reviewFormDataJson}
                                            label-data={reviewLabelDataJson}
                                            hide-empty-fields="true"
                                        ></c-intake-form-review-summary>
                                    </div>
                                </template>
                                <template if:false={hasReviewSummary}>
                                    <div class="review-empty">{labels.reviewSummaryUnavailable}</div>
                                </template>
                            </div>

                            <div class="card card-summary">
                                <h3>{labels.applicationSummary}</h3>
                                <div class="kv">
                                    <div class="k">{labels.submittedOn}</div><div class="v">{selectedApp.submittedOn}</div>
                                    <div class="k">{labels.transactionId}</div><div class="v">{selectedApp.transactionId}</div>
                                    <div class="k">{labels.currentStatus}</div>
                                    <div class="v"><span class={statusChipClass}>{selectedStatusLabel}</span></div>
                                    <div class="k">{labels.nextStage}</div><div class="v">{labels.nextStageValue}</div>
                                </div>
                            </div>

                            <div class="card decision">
                                <h3>{labels.agentDecision}</h3>
                                <div class="label">{labels.reasonRequested}</div>
                                <textarea
                                    class="full"
                                    placeholder={labels.commentsPlaceholder}
                                    value={comments}
                                    onchange={handleCommentsChange}
                                    disabled={actionsDisabled}
                                ></textarea>
                                <div class="hint">{labels.approvalHint}</div>
                            </div>
                        </div>
                        <div class="detail-foot">
                            <button class="btn" type="button" onclick={handleClear} disabled={actionsDisabled}>{labels.clearChanges}</button>
                            <button class="btn btn-primary" type="button" onclick={handleSave} disabled={actionsDisabled}>{labels.saveDecision}</button>
                        </div>
                    </template>

                    <template if:false={hasSelection}>
                        <div class="state-banner empty-state">{labels.selectApplication}</div>
                    </template>
                </div>
            </div>
        </section>

        <template if:true={showModal}>
            <div
                class="modal show"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modal-title"
                tabindex="-1"
                onkeydown={handleModalKeydown}
                onclick={handleModalBackdrop}
            >
                <div class="box">
                    <h2 id="modal-title">{modalTitle}</h2>
                    <p>{modalText}</p>

                    <template if:true={isRmiModal}>
                        <div class="modal-comments-block" style="margin-top: 12px; margin-bottom: 16px; text-align: left;">
                            <label class="select-label" for="modal-agent-comments" style="display: block; font-weight: 600; margin-bottom: 6px;">
                                {labels.reasonRequested}
                            </label>
                            <textarea
                                id="modal-agent-comments"
                                class="full"
                                rows="4"
                                style="width: 100%; border: 1px solid #c9c9c9; border-radius: 4px; padding: 8px;"
                                placeholder={labels.commentsPlaceholder}
                                value={modalComments}
                                oninput={handleModalCommentsChange}
                                onchange={handleModalCommentsChange}
                            ></textarea>
                        </div>
                    </template>

                    <div class="box-actions">
                        <button class="btn" type="button" onclick={handleModalCancel}>{labels.cancel}</button>
                        <button class="btn btn-primary" type="button" onclick={handleModalConfirm}>{modalConfirmLabel}</button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
