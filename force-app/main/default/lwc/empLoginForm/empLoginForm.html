<template>
    <div class="login-wrapper">
        <div class="login-container-main">
            <div class="backdrop custom-spinner" if:true={showSpinner}>
                <div class="spinner">
                    <div class="slds-spinner_container slds-is-fixed">
                        <div role="status" class="slds-spinner slds-spinner_medium">
                            <span class="slds-assistive-text">Loading</span>
                            <div class="slds-spinner__dot-a"></div>
                            <div class="slds-spinner__dot-b"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="login-card">
                    <h1>Log In</h1>
                    <h2 class="inspect_panels--propertyRowContent--7Y-mu inspect_panels--copyableRow--2_PiZ inspect_panels--highlightRow--21P9S" lwc-4nfn2rc40ch="">Hello there, login to the screen below</h2>
                    <p class="required-text">Asterisk (<span style="color: red;" lwc-4nfn2rc40ch="">*</span>) symbol indicates field is required.</p>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-large-size_12-of-12 slds-medium-size_12-of-12 slds-size_12-of-12">
                            <lightning-input label="Username" value={username} placeholder="Enter Email Address/Username" onchange={handleUsernameChange} required></lightning-input>
                        </div>
                        <div class="slds-col slds-large-size_12-of-12 slds-medium-size_12-of-12 slds-size_12-of-12">
                            <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                                <div class="slds-col slds-large-size_12-of-12 slds-medium-size_12-of-12 slds-size_12-of-12">
                                    <lightning-input type="password" placeholder="*********" label="Password" value={password} required onchange={handlePasswordChange}></lightning-input>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-large-size_6-of-12 slds-medium-size_6-of-12 slds-size_1-of-2">
                            <lightning-button variant="base" label="Forgot Password ?" title="Forgot Password"
                            onclick={handleForgotPassword} class="forgot-btn"></lightning-button>
                        </div>
                    </div>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-large-size_12-of-12 slds-medium-size_12-of-12 slds-size_12-of-12">
                            <lightning-button label="Login" aria-label="Click here to Login" variant="brand" onclick={handleLogin}
                            class="login-btn"></lightning-button>
                        </div>
                    </div>
                    <template if:true={errorMessage}>
                        <div class="messages error-message slds-m-top_large" tabindex="0" aria-live="assertive">
                            <div class="message-text"><img src={error_alert} alt="" srcset="">{errorMessage}</div>
                        </div>
                    </template>
                    <div class="register-block">
                        <p>Don't have an account?</p> <lightning-button variant="base" label="Create one"
                            title="Click here to Register for New Account" onclick={handleRegisterClick}
                            class="forgot-btn slds-m-left--small"></lightning-button>
                    </div>
                <!-- </template> -->
            </div>
        </div>
    </div>




</template>
