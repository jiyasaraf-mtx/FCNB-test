<template>
    <div class="backdrop" if:true={showSpinner}>
        <div class="spinner">
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </div>
    </div>
    <!-- Button to open the modal -->
    <lightning-button class="corpOfficerFocusButton base-institution-profile-btn m-r-xl" label={labels.createInstitutionProfile}
        title={labels.createInstitutionProfile} variant="base" onclick={openModal}
        aria-label={labels.createInstitutionProfile}>
    </lightning-button>
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true"
            aria-describedby="modal-content-id-2"
            class="slds-modal slds-fade-in-open add-coorporate-modal slds-modal_small">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close Create institution profile</span>
                    </button>
                    <h1 id="modal-heading-02" class="section-heading slds-m-bottom_x-small">
                        Add Institution Profile</h1>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <div class="requireMessage asterisk-caption p-b-small">
                        <p>Asterisk (<span class="c-red">*</span>) indicates required field
                        </p>
                    </div>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-large-size--3-of-3 slds-medium-size--2-of-2 slds-size--1-of-1 m-b-medium">
                            <lightning-input class="coorporateValidate" type="text"
                                label="Name of private occupational training organization"
                                placeholder="Enter Name of private occupational training organization"
                                name="accountName" maxlength="40" value={accountWrapper.accountName}
                                onchange={handleAuthInputs} required
                                message-when-value-missing="Error: Name of private occupational training organization."
                                pattern={patternObj.name}
                                message-when-pattern-mismatch="Invalid input. This field only accepts letters and numbers. Special characters are not allowed.">
                            </lightning-input>
                        </div>
                    </div>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-large-size--1-of-3 slds-medium-size--1-of-2 slds-size--1-of-1 m-b-medium">

                            <!--Web Site-->
                            <lightning-input class="authContactValidate" type="tel" label="Web Site Address"
                                placeholder="Enter Web Site Address" name="accountWebsite" onchange={handleAuthInputs}
                                value={accountWrapper.accountWebsite}>
                            </lightning-input>
                        </div>
                        <!--Telephone-->
                        <div class="slds-col slds-large-size--1-of-3 slds-medium-size--1-of-2 slds-size--1-of-1 m-b-medium">

                            <lightning-input class="authContactValidate" type="tel" label="Telephone"
                                placeholder="Enter Telephone" name="accountPhone" maxlength="10" min-length="10"
                                pattern={patternObj.phone} message-when-pattern-mismatch="Please enter Telephone only!"
                                onchange={handleAuthInputs} value={accountWrapper.accountPhone}>
                            </lightning-input>
                        </div>
                        <!-- Email -->
                        <div class="slds-col slds-large-size--1-of-3 slds-medium-size--1-of-2 slds-size--1-of-1 m-b-medium">
                            <lightning-input class="authContactValidate authContactValidateEmail" type="email"
                                label="E-mail" placeholder="Enter E-mail" name="accountEmail" maxlength="40" required
                                message-when-value-missing="Error: E-mail is required." onchange={handleAuthInputs}
                                value={accountWrapper.accountEmail} pattern={patternObj.email}
                                message-when-pattern-mismatch="Invalid email format.">
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-large-size--1-of-3 slds-medium-size--1-of-2 slds-size--1-of-1 m-b-medium">
                            <!-- Fax -->
                            <lightning-input class="authContactValidate" type="tel" label="Fax" placeholder="Enter Fax"
                                name="accountFax" pattern={patternObj.phone}
                                message-when-pattern-mismatch="Please enter Fax only!" onchange={handleAuthInputs}
                                value={accountWrapper.accountFax}>
                            </lightning-input>
                        </div>
                    </div>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <!-- Mailing Address -->
                        <div class="slds-col slds-large-size--1-of-1 slds-medium-size--1-of-1 slds-size--1-of-1 m-b-medium">
                            <h2 class="bold-20">Mailing Address</h2>
                        </div>
                        <div class="slds-col slds-large-size--1-of-1 slds-medium-size--1-of-1 slds-size--1-of-1 m-b-medium">
                            <lightning-input-address name="Mailing-address" address-label="Search Address"
                                address-lookup-placeholder=" Enter Search Address here"
                                street-placeholder="Enter Street Address" street-label="Street Address"
                                city-label="City" city-placeholder="Enter City" country-label="Country"
                                country-placeholder="Enter Country" province-label="Province"
                                province-placeholder="Enter Province" postal-code-label="Postal Code"
                                postal-code-placeholder="Enter Postal Code" show-address-lookup
                                onchange={handleAddressChange} data-id="mailadd" class="address-lookup">
                            </lightning-input-address>
                        </div>
                        <!-- Mailing Address -->
                        <div class="slds-col slds-large-size--1-of-1 slds-medium-size--1-of-1 slds-size--1-of-1 m-b-medium">
                            <h2 class="bold-20">Street Address</h2>
                        </div>
                        <div class="slds-col slds-large-size--1-of-1 slds-medium-size--1-of-1 slds-size--1-of-1 m-b-medium">
                            <lightning-input-address name="Street-address" address-label="Search Address"
                                address-lookup-placeholder=" Enter Search Address here"
                                street-placeholder="Enter Street Address" street-label="Street Address"
                                city-label="City" city-placeholder="Enter City" country-label="Country"
                                country-placeholder="Enter Country" province-label="Province"
                                province-placeholder="Enter Province" postal-code-label="Postal Code"
                                postal-code-placeholder="Enter Postal Code" show-address-lookup
                                onchange={handleAddressChange} data-id="mailadd" class="address-lookup">
                            </lightning-input-address>
                        </div>
                    </div>

                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={saveAccount} title="Save">Save</button>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
