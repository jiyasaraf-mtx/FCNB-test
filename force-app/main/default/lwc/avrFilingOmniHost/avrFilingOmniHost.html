<template>
    <div class="avr-omni-host">
        <template if:true={showFallback}>
            <div class="slds-box slds-theme_default slds-m-around_medium">
                <h1 class="slds-text-heading_medium">{labels.avrFiling}</h1>
                <p class="slds-m-top_small">{labels.omniHostHelp}</p>
                <dl class="slds-dl_horizontal slds-m-top_medium">
                    <dt class="slds-dl_horizontal__label">Type</dt>
                    <dd class="slds-dl_horizontal__detail">FCNB</dd>
                    <dt class="slds-dl_horizontal__label">Sub Type</dt>
                    <dd class="slds-dl_horizontal__detail">AVRFiling</dd>
                    <dt class="slds-dl_horizontal__label">Language</dt>
                    <dd class="slds-dl_horizontal__detail">Multi-Language</dd>
                    <dt class="slds-dl_horizontal__label">ContextId</dt>
                    <dd class="slds-dl_horizontal__detail">{displayContextId}</dd>
                </dl>
                <div class="slds-m-top_medium">
                    <lightning-button
                        variant="brand"
                        label={labels.launchOmni}
                        onclick={handleLaunch}
                    ></lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
