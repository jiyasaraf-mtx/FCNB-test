<template>
    <section role="dialog" tabindex="-1" class={getModalStyle}
        aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" onkeydown={handleEscKeyDown}>
        <div class="slds-modal__container">
            <template if:false={isHeaderless}>
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleModalClose}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close {title} Modal</span>
                    </button>
                    <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate slds-text-align--center">{title}</h1>
                </header>
            </template>
            <template if:true={isHeaderless}>
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleModalClose}>
                    <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                </button>
            </template>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <slot name="content"></slot>
            </div>
            <footer class="slds-modal__footer">
                <slot name="footer"></slot>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
