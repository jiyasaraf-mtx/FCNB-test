<template>
    <div if:true={showSpinner} style="position:relative">
        <lightning-spinner size="medium" alternative-text="Loading..." ></lightning-spinner>
    </div>
    <div class="main-container">
        <header class="slds-modal__header">
            <h2 class="slds-text-heading_medium slds-hyphenate">Portal Notification Details</h2>
        </header>
        <div class="slds-modal__content" style="min-height:100px">
            <div class="slds-grid slds-wrap" >
                <div class="slds-col slds-size_12-of-12 slds-p-horizontal--medium slds-m-bottom_small">
                    <lightning-combobox required label="Portal Notification Type" 
                    options={portalNotificationOptions} class="portalNotifType"
                    value={portalNotifWrapper.notificationType}
                    name="notificationType" onchange={handleInputChange}
                    message-when-value-missing="Portal Notification Type is required.">
                    </lightning-combobox>
                </div>
            </div>
        </div>
        <footer class="slds-modal__footer">
            <!-- <button class="slds-button slds-button_brand custom-brand-btn" onclick={handleCreateNewVisit}>Save</button> -->
            <div class="slds-clearfix">
                <div class="slds-float_right slds-p-top_small">
                    <lightning-button variant="brand" label="Send" onclick={sendNotificationHandler}></lightning-button>
                </div>
            </div>
        </footer>
    </div>
    
</template>
