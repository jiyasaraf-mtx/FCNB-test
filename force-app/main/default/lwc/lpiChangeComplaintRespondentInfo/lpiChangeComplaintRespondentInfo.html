<template>
    <div if:true={showSpinner}>
        <lightning-spinner class="spins" size="medium" data-text={spinnerText} alternative-text="Loading..."></lightning-spinner>
    </div>
    <div class="container">
        <lightning-card icon-name="action:change_owner" variant="base" heading-level="2"> 
            <!-- icon-name="action:change_owner" -->
           
            <div slot="title">
              Change Respondent Details
            </div>
            <div class="slds-m-bottom_medium sub-container">
                
               <span class="slds-p-vertical--medium slds-m-bottom_small">This Action will Change Respondent on a Submitted Complaint along with their corresponding related records.</span>
              
               <div class="slds-form slds-form_stacked slds-m-top_small">
                  <div class="slds-form-element slds-p-vertical--medium slds-m-bottom_small">
                      <div class="slds-form-element__control">
                          <lightning-combobox required label="Choose Respondent Type" options={respondentTypeOptions} value={dataObj.respondentType} name="respondentType" onchange={handleInputChange}></lightning-combobox>
                      </div>
                  </div>
                  <template if:true={isUnLicensed}>
                        <div class="slds-form-element slds-p-vertical--medium slds-m-bottom_small">
                            <lightning-radio-group required
                            label="Please select the Authorization Type."
                            class="validate slds-m-top_small radio-button-label mobile-full-width-radio"
                            name="entityOrIndividual" options={entityIndividualOptions}
                            value={dataObj.entityOrIndividual} type="radio"
                            onchange={handleInputChange}
                            message-when-value-missing="Error: Business or Individual is required.">
                            </lightning-radio-group>
                        </div>
                        <div class="slds-form-element slds-p-vertical--medium slds-m-bottom_small">
                            <lightning-combobox label="Select Board" options={boardOptions}
                                class="board-option" value={dataObj.selectedBoardName}
                                name="selectedBoardName" placeholder="Choose a Board"
                                onchange={handleInputChange} required disabled={authTypeUnSelected}
                                message-when-value-missing="Error: Board is required.">
                            </lightning-combobox>
                        </div>
                        <div class="slds-form-element slds-p-vertical--medium slds-m-bottom_small">
                            <lightning-combobox label="Select Profession" options={professionOptions}
                            class="profession-option"
                            value={dataObj.selectedProfessionName}
                            name="selectedProfessionName" placeholder="Choose a Profession"
                            onchange={handleInputChange} disabled={boardNotSelected}
                            message-when-value-missing="Error: Profession is required.">
                            </lightning-combobox>
                        </div>

                        <div class="slds-form-element slds-p-vertical--medium slds-m-bottom_small">
                            <div class="slds-form-element__control">
                                <lightning-combobox required label="Account Type" options={newExistingOptions} value={dataObj.newOrExisting} name="newOrExisting" onchange={handleInputChange}></lightning-combobox>
                            </div>
                        </div>
                  </template>
                 

                  <div lwc:if={showRecordPickerDetails} class="slds-p-vertical--medium slds-m-bottom_small"> 
                      <div class="slds-form-element">
                          <div class="slds-form-element__control">
                              <lightning-record-picker
                              lwc:ref="recordPicker"
                              name="pickerVal"
                              object-api-name={pickerConfig.sObjectName}
                              label={pickerConfig.label}
                              placeholder={pickerConfig.placeholder}
                              onchange={handleInputChange}
                              required="true"
                              ></lightning-record-picker>
                          </div>
                      </div>  
                  </div>
                 
              </div>
              <div lwc:if={accountDataSelectedAndFetched} class="slds-m-bottom_small">
                  <div class="slds-text-heading_small slds-p-vertical--medium"> Selected Account Details</div>
                  <div class="slds-grid slds-gutters slds-wrap">
      
                      <div class="slds-col slds-size_6-of-12 slds-p-vertical--small slds-m-bottom_small" if:true={selectedAccName}>
                          <div class="input-group">
                              <lightning-input name="accName" label="Account Name" class="wf-input-box" value={selectedAccName} disabled=true></lightning-input>                        
                          </div>
                      </div>
                      <div class="slds-col slds-size_6-of-12 slds-p-vertical--small slds-m-bottom_small" if:true={selectedAccPhone}>
                          <div class="input-group">
                              <lightning-input name="accPhone" label="Account Phone" class="wf-input-box" value={selectedAccPhone} disabled=true></lightning-input>                        
                          </div>
                      </div>
                      <div class="slds-col slds-size_6-of-12 slds-p-vertical--small slds-m-bottom_small" if:true={selectedAccEmail}>
                          <div class="input-group">
                              <lightning-input name="accEmail" label="Account Email" class="wf-input-box" value={selectedAccEmail} disabled=true></lightning-input>                        
                          </div>
                      </div>
                      <div class="slds-col slds-size_6-of-12 slds-p-vertical--small slds-m-bottom_small" if:true={selectedAccDBAName}>
                          <div class="input-group">
                              <lightning-input name="accDBAName" label="Doing Business As (DBA) or Trade Name" class="wf-input-box" value={selectedAccDBAName} disabled=true></lightning-input>                        
                          </div>
                      </div>
                      <div class="slds-col slds-size_6-of-12 slds-p-vertical--small slds-m-bottom_small" if:true={selectedAccFitousName}>
                          <div class="input-group">
                              <lightning-input name="accFitousName" label="Fictitious Name" class="wf-input-box" value={selectedAccFitousName} disabled=true></lightning-input>                        
                          </div>
                      </div>
                  </div>
                  <!-- {accountRecord.Email} -->
              </div>

               <div lwc:elseif={licenseDataSelectedAndFetched} class="slds-m-bottom_small">
                <div class="slds-text-heading_small slds-p-vertical--medium"> Selected License Details</div>
                    <div class="slds-grid slds-gutters slds-wrap">
                        <div class="slds-col slds-size_6-of-12 slds-p-vertical--small slds-m-bottom_small" if:true={selectedLicenseName}>
                            <div class="input-group">
                                <lightning-input name="licenseName" label="Name" class="wf-input-box" value={selectedLicenseName} disabled=true></lightning-input>                        
                            </div>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-p-vertical--small slds-m-bottom_small" if:true={selectedLicenseAccountName}>
                            <div class="input-group">
                                <lightning-input name="licenseAccountName" label="License Account Name" class="wf-input-box" value={selectedLicenseAccountName} disabled=true></lightning-input>                        
                            </div>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-p-vertical--small slds-m-bottom_small" if:true={selectedLicenseProfession}>
                            <div class="input-group">
                                <lightning-input name="licenseProfession" label="Profession" class="wf-input-box" value={selectedLicenseProfession} disabled=true></lightning-input>                        
                            </div>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-p-vertical--small slds-m-bottom_small" if:true={selectedLicenseBoard}>
                            <div class="input-group">
                                <lightning-input name="licenseBoard" label="Board" class="wf-input-box" value={selectedLicenseBoard} disabled=true></lightning-input>                        
                            </div>
                        </div>
                    </div>
               </div>

                <!-- NEW Account Creation Fields.  Starts -->  
                <div class="slds-text-heading_small slds-p-vertical--medium" lwc:if={showNewAccountSection}> Respondent Details </div>

                <div class="slds-gutters slds-grid slds-wrap" lwc:if={showNewAccountSection}>
                   <!-- TODO :  Add proper max lengths -->
                    <div class="slds-col slds-size_12-of-12" if:true={businessAccountSelected}>
                            <!-- required message added by Ayman - S-56033-->
                            <lightning-input type="text" pattern={patternObj.text} data-respondent="true"
                                label="Entity Name" value={dataObj.accountInfo.entityName} name="entityName"
                                onchange={handleInputChange} required=true autocomplete="off"
                                message-when-value-missing="Error: Entity Name is required.">
                            </lightning-input>
                    </div>
                    <div class="slds-col slds-size_6-of-12" if:false={businessAccountSelected}>
                        <!-- required message added by Ayman - S-56033-->
                        <lightning-input type="text" pattern={patternObj.text} data-respondent="true"
                            label="First Name" value={dataObj.accountInfo.firstName} name="firstName"
                            onchange={handleInputChange} required=true autocomplete="off" max-length="40"
                            message-when-value-missing="Error: First Name is required.">
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_6-of-12" if:false={businessAccountSelected}>
                        <!-- required message added by Ayman - S-56033-->
                        <lightning-input type="text" pattern={patternObj.text} data-respondent="true"
                            label="Middle Name" value={dataObj.accountInfo.middleName} name="middleName"
                            onchange={handleInputChange} autocomplete="off" max-length="40"
                            message-when-value-missing="Error: Middle Name is required.">
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_6-of-12" if:false={businessAccountSelected}>
                        <!-- required message added by Ayman - S-56033-->
                        <lightning-input type="text" pattern={patternObj.text} data-respondent="true"
                            label="Last Name" value={dataObj.accountInfo.lastName} name="lastName"
                            onchange={handleInputChange} required=true autocomplete="off" max-length="80"
                            message-when-value-missing="Error: Last Name is required.">
                        </lightning-input>
                    </div>
        
                    <div class="slds-col slds-size_6-of-12">
                        <!-- required message added by Ayman - S-56033-->
                        <lightning-input type="email" pattern={patternObj.email} data-respondent="true"
                            label="Email" value={dataObj.accountInfo.email} name="email" max-length="80"
                            onchange={handleInputChange} required=true autocomplete="off"
                            message-when-value-missing="Error: Email is required.">
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_6-of-12">
                        <lightning-input class="phoneNumberField" type="tel"
                            label="Telephone Number" autocomplete="off"
                            value={dataObj.accountInfo.telephone} name="telephone"
                            max-length="14" onchange={handleInputChange}
                            pattern={patternObj.digits} data-respondent="true"
                            message-when-pattern-mismatch="Your Entry does not match the pattern"
                            message-when-value-missing="Error: Telephone Number is required.">
                        </lightning-input>
                    </div>

                    <!-- Address Fields Start.  -->
                    <div class="slds-col slds-size_12-of-12">
                        <div class="slds-text-heading_small slds-p-vertical--medium">Address Details</div>
                    </div>

                    <div class="slds-col slds-size_12-of-12">
                        <lightning-input type="text" required pattern={patternObj.text} label="Street Address"
                            data-address="true" data-respondent="true" autocomplete="off"
                            value={dataObj.accountInfo.addressData.streetOne}
                            name="streetOne" onchange={handleInputChange} max-length="255"
                            message-when-value-missing="Error: Street Address is required.">
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_6-of-12">
                        <lightning-input type="text" 
                            data-address="true" data-respondent="true"
                            pattern={patternObj.text} label="City" max-length="40"
                            value={dataObj.accountInfo.addressData.city}
                            name="city" onchange={handleInputChange}
                            autocomplete="off"
                            message-when-value-missing="Error: City is required.">
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_6-of-12">
                        <template if:true={countryOptions}>
                            <lightning-combobox label="Country" options={countryOptions}
                                value={dataObj.accountInfo.addressData.country} name="country" 
                                data-address="true" data-respondent="true" 
                                max-length="80" onchange={handleInputChange}
                                data-index={index} message-when-value-missing="Error: Country is required.">
                            </lightning-combobox>
                        </template>
                    </div>

                    <div class="slds-col slds-size_6-of-12">
                        <lightning-combobox label="State" required options={stateOptions} if:false={showOtherStateField}
                            data-address="true" data-respondent="true"
                            value={dataObj.accountInfo.addressData.state}
                            name="state" onchange={handleInputChange}
                            message-when-value-missing="Error: State is required.">
                        </lightning-combobox>

                        <lightning-input type="text" required pattern={patternObj.text} label="State" if:true={showOtherStateField}
                        value={dataObj.accountInfo.addressData.otherState} name="otherState"
                        data-address="true" data-respondent="true" onchange={handleInputChange}
                        max-length="40" autocomplete="off" message-when-value-missing="Error: State is required.">
                        </lightning-input>

                    </div>
                    <div class="slds-col slds-size_6-of-12">
                        <lightning-input type="text" pattern={patternObj.text}
                            label="County" value={dataObj.accountInfo.addressData.county} name="county"
                            data-address="true" data-respondent="true" max-length="60" onchange={handleInputChange} autocomplete="off"
                            data-index={index}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_6-of-12">
                        <lightning-input type="text" required label="Zip Code" 
                            name="zipCode" value={dataObj.accountInfo.addressData.zipCode}
                            max-length="10" min-length="5" pattern={patternObj.zipCode}
                            placeholder="A1A 1A1"
                            data-address="true" data-respondent="true" autocomplete="off"
                            message-when-pattern-mismatch="Please enter a valid Canadian Postal Code (e.g. A1A 1A1)."
                            onchange={handleInputChange} message-when-value-missing="Error: Zip Code is required.">
                        </lightning-input>
                    </div>
                    <!-- AddressFields End  -->
                </div>  



                <!-- NEW Account Creation Fields.  Ends -->
             </div>
             
            <div slot="footer" class="slds-clearfix slds-text-align_right">
                  <lightning-button variant="brand" label="Change" onclick={handleSubmit}></lightning-button>
            </div>
            <div>
            </div>
          </lightning-card>

        <div lwc:if={openConfirmationModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open"
                onkeydown={handleEscKeyDown}>
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            onclick={handleCancelConfirmation}>
                            <lightning-icon icon-name="utility:close" variant="inverse" size="small" title="Close">
                            </lightning-icon>
                            <span class="slds-assistive-text">Confirm Modal</span>
                        </button>
                        <h1 id="modal-heading-03" class="section-heading slds-hyphenate">
                            Confirmation Details</h1>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-03">
                        <p>{confirmationText}</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral"
                            onclick={handleCancelConfirmation} title="Cancel">Cancel</button>
                        <button class="slds-button slds-button_brand"
                            onclick={handleConfirmation} title="Confirm">Confirm</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
    </div>

</template>
