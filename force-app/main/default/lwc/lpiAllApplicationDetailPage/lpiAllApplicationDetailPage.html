<template>
    <div class="backdrop" if:true={showSpinner}>
        <div class="spinner">
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </div>
    </div>
    <h1 if:true={isAllApplication} class="bold-32">{labels.allApplications}</h1>
    <h1 if:false={isAllApplication} class="bold-32">{labels.myApplications}</h1>
    <div class="slds-grid slds-gutters dashboard-details my-licenses my-application p-t-medium">
        <template for:each={statusFilter} for:item="item">
            <div class={item.class} key={item.label} data-id={item.value} onclick={getMyApplicationDetails} onkeydown={handleKeyDown}><!--onkeydown={handleKeyDown} tabindex="0"-->
                <div class="slds-card"  data-id={item.value} tabindex="0" aria-label={item.label}>
                    <div class="slds-clearfix" data-id={item.value}>
                        <div class="slds-float_top slds-m-bottom_small" data-id={item.value}>
                            <i class={item.iconUrl}></i>
                            <!-- <img src={item.iconUrl} data-id={item.value} alt={item.value} /> -->
                        </div>
                        <div class="slds-float_bottom" data-id={item.value}>
                            <h2 class="slds-page-header__title" data-id={item.value}>{item.label}</h2>
                            <div class="licenses-counter" data-id={item.value}>{item.Count}</div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
    <div class="warning-message-box slds-p-top_none slds-list_horizontal slds-grid_vertical-align-center">
        <lightning-icon class=" slds-icon-utility-info-alt slds-icon_container slds-m-right_small" icon-name="utility:info_alt" title={labels.warning}>
            <span style="--sds-c-icon-color-background: var(--slds-c-icon-color-background, transparent)" part="boundary">
                <lightning-primitive-icon size="medium" variant="">...</lightning-primitive-icon>
                <span class="slds-assistive-text">{labels.warning}</span>
            </span>
        </lightning-icon>
        <div class="slds-media__body">
            <div>{labels.importantNotice}</div>
            <p>{labels.noticeApplication}</p>
        </div>
    </div>
    <div class='slds-m-vertical_large dashboard-table-details all-applications-table'>
        <div class="slds-card"> 
            <h3 class="slds-m-bottom_small">{childCardTitle}</h3>
            <c-lpi-dashboard-table-details onchildmethod={callFromChild} paymentdata={paymentdata}
                applicationdata={applicationdata} licensedata={licensedata} columns={myApplicationColumns}
                recordsdata={recordsData} titledata={childCardTitle}></c-lpi-dashboard-table-details>
        </div>
    </div>
</template>
