        </template>

     <!--  Start S-44731 Business Account Modal window Code Start  -->
     <template if:true={openBusinessModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open lpi-modal slds-modal_medium">
            <div class="slds-modal__container">
                <!-- Modal header  -->
                <div class="slds-modal__header">
                    <h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate">Account Selection</h1>
                </div>
                <!-- Modal body  -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <p class="asterisk-caption m-b-medium">Asterisk (<span class="c-red">*</span>) indicates required field</p>
                    <!-- <p>For individual licenses or applications, choose "<b>Personal Account</b>". If you're dealing with business licenses or applications for existing Business accounts, select "<b>Existing Business Account</b>". To apply for a new Business license, pick the "<b>New Business Account</b>" option.</p> -->
                    <div class="slds-grid homepage slds-gutters slds-wrap">
                        <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-large-size_4-of-12 anchor-card m-b-large">
                            <a href="Javascript:void(0);" class="selectPersonal" label="Personal Account" data-name="Personal Account" onclick={handleAccount}>
                                <div class="anchor-card-body">
                                    <i class="material-icon material-icon-select"></i>
                                    <h2 class="m-t-large bold-24">Personal Account</h2>
                                    <p class="text-secondary m-t-xs">For Individual licenses or applications, choose this.</p>
                                    <i class="material-icon material-icon-arrow_forward"></i>
                                </div>            
                            </a>
                        </div>
                    <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-large-size_4-of-12 anchor-card m-b-large">
                            <a href="Javascript:void(0);" class="selectBusiness" label="Existing Business Account" data-name="Business Account" onclick={handleBusinessAccount}>
                                <div class="anchor-card-body" >
                                    <i class="material-icon material-icon-select"></i>
                                    <h2 class="m-t-large bold-24">Existing Business Account</h2>
                                    <p class="text-secondary m-t-xs">Select from the dropdown pre-existing Business accounts.</p>
                                    <i class="material-icon material-icon-arrow_forward"></i>
                                </div>            
                            </a>
                    </div>
                        <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-large-size_4-of-12 anchor-card m-b-large">
                            <a href="Javascript:void(0);" class="selectNewBusiness" label="New Business Account" data-name="New Business Account" onclick={handleNewBusiness}>
                                <div class="anchor-card-body">
                                    <i class="material-icon material-icon-select"></i>
                                    <h2 class="m-t-large bold-24">New Business Account</h2>
                                    <p class="text-secondary m-t-xs">Apply for a new Business license, pick this option.</p>
                                    <i class="material-icon material-icon-arrow_forward"></i>
                                </div>            
                            </a>
                        </div>
                    </div>
                    <!-- <lightning-radio-group name="selectType"
                                        data-id="selecttype"
                                        label="Select Account Type"
                                        options={selectedAccountList}
                                        value={selectedType}
                                        type="radio"
                                        onchange={handleChangeAccount} 
                                        class="bordered_radio"
                                        required>
                    </lightning-radio-group> -->
                    <template if:true={showBusinessAccountList}>
                        <label for="FieldSelect" class="slds-form-element__label slds-no-flex">
                            <abbr title="required" class="slds-required">*</abbr>
                            Select Business Account
                        </label>
                        <select class="slds-select homepage-select-box" name = "optionSelect" onchange={handleBusinessChange}>
                            <option value="">Please Select Account</option>
                            <template for:each={acrList} for:item="item">
                                <option key={item} value={item.Id}>{item.Name}</option>
                            </template>
                        </select> 
                        <!-- Display the custom error message if it Business Account is empty -->
                        <template if:true={isSelectBusinessTypeAvailable}>
                            <p class="slds-text-color_error">{selectBusinessTypeErrorMessage}</p>
                        </template>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button 
                    variant="brand"
                    label="Continue"
                    onclick={handleConfirm}
                ></lightning-button>
                    </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
     <!-- END S-44731 Business Account Modal window Code END  -->
</template>
