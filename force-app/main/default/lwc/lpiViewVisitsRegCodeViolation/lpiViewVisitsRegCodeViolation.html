<template>
    <div if:true={showSpinner}>
        <lightning-spinner size="medium" alternative-text="Loading..."></lightning-spinner>
    </div>
    <h1 class="slds-m-bottom_medium">{title}</h1>

    <div class="slds-card" if:false={hasRecords}>
        <div class="slds-illustration slds-illustration_small">
            <img alt="No Records Found"  src={noRecord}>
            <div class="slds-text-longform m-t-medium">
                <h3 class="slds-text-heading_medium">No Inspections/Regulatory Code Violations Found</h3>
            </div>
        </div>
        <!-- <span>No Inspections/Regulatory Code Violations Found</span> -->
    </div>
    <p class="asterisk-caption m-b-medium" if:true={isEditable}>Asterisk (<span class="c-red">*</span>) indicates required field</p>
    <!-- Confirmation Popup -->
    <template if:true={openConfirmationModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={handleCancelConfirmation}>
                        <lightning-icon icon-name="utility:close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close Confirmation modal</span>
                    </button>
                    <h1 id="modal-heading-03" class="section-heading slds-hyphenate">
                        Submit Details</h1>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-03">
                    <p>{modalHeading}</p>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleCancelConfirmation}
                        title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={saveCommentHelper}
                        title="Save">Submit</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template for:each={visitDetails} for:item="visitRec" for:index="index">
        <div class="slds-m-vertical_large" key={visitRec.visitId}>
            <lightning-card>

                <h2 class="bold-20 m-b-small m-t-large">{visitRec.sectionDesc}</h2>
                <div style="overflow: auto;">
                    <table class="slds-table slds-table_bordered slds-no-row-hover alpha-table-layout">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th class="" scope="col">
                                    <div class="slds-truncate" title="Inspection Name">Inspection Name</div>
                                </th>
                                <th class="" scope="col">
                                    <div class="slds-truncate" title="Inspection Type">Inspection Type</div>
                                </th>
                                <th class="" scope="col">
                                    <div class="slds-truncate" title="Inspection Type">Inspector Name</div>
                                </th>
                                <th class="" scope="col">
                                    <div class="slds-truncate" title="Inspection Type">Begin Date</div>
                                </th>
                                <th class="" scope="col">
                                    <div class="slds-truncate" title="Inspection Type">Inspection Completed Date</div>
                                </th>
                                <th class="" scope="col">
                                    <div class="slds-truncate" title="PIC/MIC Signature">PIC/MIC Signature</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr key={visitRec.visitId} class="slds-hint-parent">

                                <td data-label="Inspection Name">
                                    <div style="white-space:normal; word-break: break-word;" title={visitRec.visitName}>
                                        {visitRec.visitName}</div>
                                </td>
                                <td data-label="Inspection Type">
                                    <div class="" style="white-space:normal; word-break:break-word"
                                        title={visitRec.inspectionType}>
                                        {visitRec.inspectionType}</div>
                                </td>
                                <td data-label="Inspector Name">
                                    <div class="" style="white-space:normal; word-break:break-word"
                                        title={visitRec.inspectorName}>
                                        {visitRec.inspectorName}</div>
                                </td>
                                <td data-label="Begin Date">
                                    <div class="" style="white-space:normal; word-break:break-word"
                                        title={visitRec.inspectionStartDate}>
                                        {visitRec.inspectionStartDate}</div>
                                </td>
                                <td data-label="Inspection Completed Date">
                                    <div class="" style="white-space:normal; word-break:break-word"
                                        title={visitRec.inspectionCompletedDate}>
                                        {visitRec.inspectionCompletedDate}</div>
                                </td>
                                <td data-label="PIC/MIC Signature">
                                    <div style="position: absolute;left: 0;" class="mandatory-mark"
                                        if:false={visitRec.isDisabled}>*</div>
                                        <lightning-input type="text" name="picMicSignature" value={visitRec.comments}
                                        placeholder="Enter PIC/MIC Signature" class="picMicSignature"
                                        data-index={visitRec.sNo} data-visit-id={visitRec.visitId}
                                        pattern={patternObj.text} disabled={visitRec.isDisabled}
                                        maxlength="255"></lightning-input>
                                    <!-- onchange={handleSignatureChange} -->
                                </td>

                            </tr>
                        </tbody>
                    </table>
                </div>
                <template if:true={visitRec.hasCodeViolation}>
                    <h2 class="bold-20 m-b-small m-t-large">{visitRec.regCodeViolationSectionDesc}</h2>
                    <div style="overflow: auto;">
                        <table
                            class="slds-table slds-table_bordered slds-no-row-hover alpha-table-layout ">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="S.NO.">S.NO.</div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="Violation Name">Regulatory Code
                                        </div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="Violation Name">Board Staff Comments
                                        </div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="Violation Type">Violation Type</div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="Duration">Duration
                                        </div>
                                    </th>
                                    <!-- <th class="" scope="col">
                                        <div class="slds-truncate" title="Violation Start Date">Violation Start Date
                                        </div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="Violation End Date">Violation End Date</div>
                                    </th> -->
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="Violation Comments">Violation Comments</div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="Licensee Comments">Licensee Comments</div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={visitRec.regCodeViolationList} for:item="rcvRec" for:index="index">

                                    <tr key={rcvRec.rcvId} class="slds-hint-parent">
                                        <td data-label="S.NO.">
                                            <div class="slds-truncate" title={index}>{rcvRec.sNo}</div>
                                        </td>
                                        <td data-label="Violation Name">
                                            <div style="white-space:normal; word-break: break-word;"
                                                title={rcvRec.rcvName}>
                                                {rcvRec.regulatoryCode}</div>
                                        </td>
                                        <td data-label="Regulatory Code Description">
                                            <div style="white-space:normal; word-break: break-word;"
                                                title={rcvRec.boardStaffComments}>
                                                {rcvRec.boardStaffComments}</div>
                                        </td>
                                        <td data-label="Violation Type">
                                            <div class="" style="white-space:normal; word-break:break-word"
                                                title={rcvRec.rcvType}>
                                                {rcvRec.rcvType}</div>
                                        </td>
                                        <td data-label="Violation Start Date">
                                            <div class="" style="white-space:normal; word-break:break-word"
                                                title={rcvRec.rcvStartDate}>
                                                {rcvRec.rcvStartDate} - {rcvRec.rcvEndDate}</div>
                                        </td>
                                        <!-- <td data-label="Violation End Date">
                                            <div class="" style="white-space:normal; word-break:break-word"
                                                title={rcvRec.rcvEndDate}>
                                                {rcvRec.rcvEndDate}</div>
                                        </td> -->
                                        <td data-label="Violation Comments">
                                            <div class="" style="white-space:normal; word-break:break-word"
                                                title={rcvRec.comments}>
                                                {rcvRec.comments}</div>
                                        </td>
                                        <td data-label="Licensee Comments">
                                            <div class="" style="white-space:normal; word-break:break-word"
                                                title={rcvRec.licenseeComments}>
                                                <div style="position: absolute;left:0;" class="mandatory-mark"
                                                    if:false={rcvRec.isDisabled}>*</div>
                                                    <lightning-textarea name="licenseeComments"
                                                        value={rcvRec.licenseeComments} placeholder="Enter Comments"
                                                        class="licenseeComments" data-index={rcvRec.sNo}
                                                        data-rcv-id={rcvRec.rcvId} data-visit-id={visitRec.visitId}
                                                        pattern={patternObj.text} disabled={rcvRec.isDisabled}
                                                        maxlength="1000"></lightning-textarea>
                                                <!-- onchange={handleLicenseeComments} -->

                                            </div>
                                        </td>

                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <div class="slds-clearfix" if:false={visitRec.hideSubmitBtn}>
                    <div class="slds-float_right slds-p-top_small">
                        <lightning-button variant="brand" data-visit-id={visitRec.visitId}
                            data-visit-name={visitRec.visitName} label="Submit"
                            onclick={saveCommentsHandler} disabled={submitDisabled}></lightning-button>
                    </div>
                </div>
                <template if:true={visitRec.hasQualityAssuranceForm}>
                    <c-lpi-quality-assurance-details
                        questions={visitRec.inspectionAssessmentQuestions}></c-lpi-quality-assurance-details>
                </template>
            </lightning-card>

        </div>

    </template>
</template>
